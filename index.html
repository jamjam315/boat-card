<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>艇読み — ボートレース データカード</title>
<style>
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#13242a; --ink2:#4a5a61; --muted:#7c8a90;
  --line:#e2e5e0; --line2:#d3d8d2; --water:#0f2a33; --accent:#0e7c66; --accent-soft:#dff0ea;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10171a; --surface:#182226; --ink:#eef3f2; --ink2:#aebcc0; --muted:#7e8d92;
    --line:#243136; --line2:#2e3d43; --water:#0a1b20; --accent:#3bbf9e; --accent-soft:#16302a; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;}
.wrap{max-width:680px; margin:0 auto; padding:0 14px 40px;}
.nums{font-variant-numeric:tabular-nums lining-nums;}

.topbar{background:var(--water); color:#eaf3f0; border-radius:0 0 var(--radius) var(--radius);
  padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  position:relative; overflow:hidden;}
.topbar::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, transparent 0 17px, rgba(255,255,255,.05) 17px 18px);}
.brand{display:flex; align-items:center; gap:11px; position:relative; z-index:1;}
.lanes{display:grid; grid-template-rows:repeat(6,1fr); gap:2px; width:16px; height:34px;}
.lanes i{display:block; border-radius:2px;}
.brand h1{font-size:18px; font-weight:600; margin:0; letter-spacing:.04em;}
.brand p{font-size:11.5px; margin:1px 0 0; color:#9fc3ba; letter-spacing:.02em;}
.datepill{position:relative; z-index:1; font-size:12.5px; color:#cfe6df; white-space:nowrap;
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 11px;}

.feat{display:block; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--accent); border-radius:var(--radius);
  margin-top:16px; padding:15px 18px; transition:opacity .12s;}
.feat:active{opacity:.75;}
.feat-eyebrow{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.05em;}
.feat-catch{font-size:19px; font-weight:800; color:var(--ink); margin-top:6px; line-height:1.4;}
.feat-basis{font-size:12px; color:var(--ink2); margin-top:4px; line-height:1.55;}
.feat-meta{font-size:12px; color:var(--ink2); margin-top:9px; padding-top:9px; border-top:1px dashed var(--line2);}
.feat-meta b{color:var(--ink); font-weight:600;}
.feat-k{font-size:10.5px; font-weight:600; color:var(--ink2); border:1px solid var(--line2);
  border-radius:5px; padding:1px 6px; margin-left:3px;}

.seg{margin-top:18px;}
.seg-label{font-size:11.5px; color:var(--muted); letter-spacing:.08em; margin:0 0 7px 2px;}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:thin;}
.chips::-webkit-scrollbar{height:5px} .chips::-webkit-scrollbar-thumb{background:var(--line2); border-radius:3px}
.chip{flex:0 0 auto; border:1px solid var(--line2); background:var(--surface); color:var(--ink2);
  font:inherit; font-size:13.5px; padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s;}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.chip[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.chips.races .chip{min-width:46px; text-align:center; padding:7px 10px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-top:18px; overflow:hidden;}
.card-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
  align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.card-head .ttl{font-size:16px; font-weight:600;}
.card-head .ttl span{font-weight:400; color:var(--ink2); font-size:13.5px; margin-left:6px;}
.card-head .dl{font-size:12.5px; color:var(--muted);}

.boat{display:grid; grid-template-columns:40px 1fr auto; gap:13px; align-items:center;
  padding:13px 18px; border-bottom:1px solid var(--line);}
.boat:last-child{border-bottom:none}
.badge{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:700; border:1px solid rgba(125,125,125,.3);}
.bname{font-size:15px; font-weight:600;}
.bname a{color:inherit; text-decoration:underline; text-decoration-color:var(--line2);
  text-decoration-thickness:1.5px; text-underline-offset:3px; display:inline-block; padding:3px 0;}
.bname a:active{opacity:.6;}
.bname a::after{content:"›"; display:inline-block; margin-left:2px; color:var(--accent); font-weight:700;}
.bk{font-size:11px; font-weight:600; color:var(--ink2); border:1px solid var(--line2);
  border-radius:5px; padding:1px 6px; margin-left:5px;}
.bmeta{font-size:12.5px; color:var(--ink2); margin-top:2px;}
.kon{font-size:12px; color:var(--ink2); margin-top:3px;}
.kon b{color:var(--ink); font-weight:600;}
.kon.thin{color:var(--muted); font-style:italic;}
.st-tag{display:inline-block; font-size:11px; font-weight:600; border-radius:5px; padding:1px 6px; margin-left:6px; border:1px solid transparent; vertical-align:1px;}
.st-tag .stl{font-weight:400; margin-left:3px; opacity:.85;}
.st-a{background:#fde7e7; color:#b32b2b; border-color:#f3c9c9;}
.st-n{background:#eceef0; color:#54616a; border-color:#dde1e4;}
.st-c{background:#e3eef0; color:#2b6b78; border-color:#cfe1e4;}
@media (prefers-color-scheme: dark){
  .st-a{background:#3a1d1d; color:#f3a3a3; border-color:#542a2a;}
  .st-n{background:#222d32; color:#9fb0b6; border-color:#33424a;}
  .st-c{background:#16323a; color:#7fcdd9; border-color:#234a54;}
}
.stats{display:flex; gap:15px; align-items:flex-start;}
.stat{text-align:right;}
.stat .l{font-size:10.5px; color:var(--muted);}
.stat .v{font-size:15px; font-weight:600;}
.stat.mo{min-width:62px;}
.bar{height:4px; background:var(--bg); border-radius:2px; margin-top:4px; overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent);}
.mprev{font-size:10px; color:var(--ink2); margin-top:4px; white-space:nowrap;}
.mprev.thin{color:var(--muted); font-style:italic;}
.mprev a{color:inherit; text-decoration:underline; text-decoration-color:var(--line2); text-underline-offset:2px;}

.trend{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-top:14px; padding:14px 18px;}
.trend-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.trend-ttl{font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
.trend-ttl .pin{width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block;}
.trend-sub{font-size:11.5px; color:var(--muted);}
.trow{display:grid; grid-template-columns:74px 1fr 58px; align-items:center; gap:10px; padding:4px 0;}
.trow.tthin{opacity:.55;}
.tcourse{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2);}
.tdot{width:10px; height:10px; border-radius:3px; border:1px solid rgba(125,125,125,.4); flex:0 0 auto;}
.tbar{height:8px; background:var(--bg); border-radius:4px; overflow:hidden; position:relative;}
.tbar i{display:block; height:100%; position:absolute; left:0; top:0; border-radius:4px;}
.tbar i.p3{background:var(--accent); opacity:.32;}
.tbar i.win{background:var(--accent);}
.tval-wrap{display:flex; flex-direction:column; align-items:flex-end; line-height:1.3;}
.tval{font-size:13px; font-weight:600; text-align:right;}
.tval-sub{font-size:10.5px; font-weight:400; color:var(--muted);}
.tlegend{font-size:11px; color:var(--muted); margin:0 0 8px; display:flex; flex-wrap:wrap; gap:4px 14px;}
.tlegend span{display:inline-flex; align-items:center; gap:5px;}
.tlegend b{width:10px; height:10px; border-radius:3px; display:inline-block; background:var(--accent);}
.tlegend b.p3{opacity:.32;}
.thint{font-size:12px; color:var(--ink2); margin-top:10px; padding-top:10px; border-top:1px dashed var(--line2); line-height:1.55;}
.tna{font-size:12.5px; color:var(--muted); padding:4px 0;}

.wsec{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line2);}
.wsec-head{font-size:13px; font-weight:600; display:flex; align-items:baseline; gap:8px; margin-bottom:9px;}
.wsec-head span{font-size:11px; color:var(--muted); font-weight:400;}
.wgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.wcell{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 6px 7px; text-align:center;}
.wcell.wtop{border-color:var(--accent); background:var(--accent-soft);}
.wemo{font-size:12px; color:var(--ink2);}
.wwin{font-size:19px; font-weight:700; margin-top:2px;}
.wn{font-size:10.5px; color:var(--muted); margin-top:1px;}
.wcell.wthin{opacity:.5;}
.whint{font-size:12px; color:var(--ink); margin-top:10px; line-height:1.55;}
.whint b{color:var(--accent);}
.wnote{font-size:11px; color:var(--muted); margin-top:6px;}

.krow{display:grid; grid-template-columns:74px 1fr 44px; align-items:center; gap:10px; padding:3px 0;}
.krow.kthin{opacity:.55;}
.kname{font-size:12.5px; color:var(--ink2);}
.kbar{height:8px; background:var(--bg); border-radius:4px; overflow:hidden;}
.kbar i{display:block; height:100%; background:var(--line2);}
.krow.ktop .kbar i{background:var(--accent);}
.krow.ktop .kname{color:var(--ink); font-weight:600;}
.kval{font-size:13px; font-weight:600; text-align:right;}
.krow.kthin .kval{font-weight:400;}

.legend{font-size:11.5px; color:var(--muted); margin:12px 4px 0; display:flex; flex-wrap:wrap; gap:4px 12px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend b{width:11px; height:11px; border-radius:3px; border:1px solid rgba(125,125,125,.3); display:inline-block;}
.foot{margin-top:20px; padding:14px 4px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px;}
.foot b{color:var(--ink2); font-weight:600;}
@media (max-width:460px){
  .stats{gap:11px} .stat .v{font-size:14px} .stat.mo{min-width:54px}
  .boat{grid-template-columns:36px 1fr auto; gap:10px; padding:12px 14px}
  .bname{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="lanes" aria-hidden="true">
        <i style="background:#fff"></i><i style="background:#2b2b2b"></i><i style="background:#d83a36"></i>
        <i style="background:#2f6fd0"></i><i style="background:#f2c200"></i><i style="background:#1f9e54"></i>
      </div>
      <div><h1>艇読み</h1><p>公式番組表を、読める形に。</p></div>
    </div>
    <div class="datepill nums" id="datepill"></div>
  </header>

  <div id="featured"></div>

  <div class="seg"><p class="seg-label">レース場</p><div class="chips venues" id="venues" role="tablist" aria-label="レース場"></div></div>
  <div class="seg"><p class="seg-label">レース</p><div class="chips races" id="races" role="tablist" aria-label="レース番号"></div></div>

  <main id="card"></main>

  <p class="legend" aria-label="枠番の色">枠の色＝艇番（公式の枠番カラー）：
    <span><b style="background:#fff"></b>1</span><span><b style="background:#2b2b2b"></b>2</span>
    <span><b style="background:#d83a36"></b>3</span><span><b style="background:#2f6fd0"></b>4</span>
    <span><b style="background:#f2c200"></b>5</span><span><b style="background:#1f9e54"></b>6</span>
  </p>
  <p class="foot"><b>予想印（◎○▲）は出していません。</b>勝率・モーター2率を並べ、会場のコース傾向と選手のスタート傾向を添えるので、見て自分で決めるための道具です。<br>出典：公式の番組表・競走成績を整形して表示。「この会場のクセ」「選手のST癖（8走以上の平均ST）」は直近の結果データの集計です。</p>
</div>

<script src="data.js"></script>
<script src="stats.js" onerror="window.STATS=null"></script>
<script src="players.js" onerror="window.PLAYERS=null"></script>
<script src="players_index.js" onerror="window.PLAYER_PAGES=null"></script>
<script src="featured.js" onerror="window.FEATURED=null"></script>
<script src="motors.js" onerror="window.MOTORS=null"></script>
<script>
const LANES = {
 1:{bg:"#ffffff",fg:"#1a1a1a"},2:{bg:"#2b2b2b",fg:"#ffffff"},3:{bg:"#d83a36",fg:"#ffffff"},
 4:{bg:"#2f6fd0",fg:"#ffffff"},5:{bg:"#f2c200",fg:"#3a2e00"},6:{bg:"#1f9e54",fg:"#ffffff"}
};
if(!window.DATA){document.getElementById("card").innerHTML="<p style=\"padding:20px;color:#888\">データ読み込み中…</p>";}
const PLAYER_PAGES = new Set(window.PLAYER_PAGES || []);
let vi=0, rno=null;
document.getElementById("datepill").textContent = DATA.date;

function el(html){const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild;}
function num(x,d){return (x==null)?"—":Number(x).toFixed(d);}
function playerName(name,toban,crewParam){
  if(toban && PLAYER_PAGES.has(toban)){
    const q = crewParam ? `?crew=${crewParam}` : "";
    return `<a href="players/${toban}.html${q}" target="_blank" rel="noopener">${name}</a>`;
  }
  return name;
}
function motorPrevLine(venueName, mno){
  const M=window.MOTORS;
  if(!M || mno==null) return "";
  const rec = M[`${venueName}:${mno}`];
  if(rec===undefined) return "";
  if(!rec) return `<div class="mprev thin">前回：データなし（新機の可能性）</div>`;
  const nameHtml = PLAYER_PAGES.has(rec.touban)
    ? `<a href="players/${rec.touban}.html" target="_blank" rel="noopener">${rec.name}</a>`
    : rec.name;
  return `<div class="mprev">前回：${rec.k?rec.k+" ":""}${nameHtml}</div>`;
}
function stTag(toban){
  const P=window.PLAYERS;
  if(!P||!P.players||!toban) return "";
  const p=P.players[toban];
  if(!p||p.n<(P.min||8)) return "";
  const st=p.st;
  let cls="st-n", label="標準";
  if(st<=0.140){cls="st-a"; label="攻";}
  else if(st>=0.185){cls="st-c"; label="慎重";}
  return `<span class="st-tag ${cls}">ST ${st.toFixed(2)}<span class="stl">${label}</span></span>`;
}

function konSetsuLine(ks){
  const label = (ks && ks.which) || "今節";
  if(!ks || !ks.r || ks.r.length===0) return `<div class="kon thin">${label}の走行データが見当たりません</div>`;
  const n=ks.r.length;
  if(n<2) return `<div class="kon thin">${label}データ少なめ（${n}走）</div>`;

  // 着順の流れ(直近3走を新しい順に見せる)
  const flow = ks.r.slice(-3).map(c => c<=3 ? `${c}着` : "着外").join("→");

  // 進入の傾向(平均コース)。際立つ時だけ一言添える(「進入まちまち」=特徴なしは出さない)。
  // STの安定度はカードに既にSTバッジがあり二重表現かつほぼ常に「ばらつき」で情報にならないため、ここには出さない。
  const avgC = ks.c.reduce((a,b)=>a+b,0)/ks.c.length;
  let courseHint = "";
  if(avgC<=1.6) courseHint="進入ほぼイン";
  else if(avgC>=4) courseHint="進入は外めが多い";

  const tail = n<4 ? `<span class="thin">（${label}${n}走）</span>` : "";
  return `<div class="kon"><b>${label}</b> ${flow}${courseHint?" / "+courseHint:""} ${tail}</div>`;
}

function renderFeatured(){
  const box=document.getElementById("featured");
  const F=window.FEATURED;
  if(!F || !PLAYER_PAGES.has(F.toban)){ box.innerHTML=""; return; }
  const racesTxt = F.races.length<=1 ? `${F.races[0]}R`
    : F.races.slice(0,-1).map(r=>`${r}R`).join("・") + "と" + F.races[F.races.length-1] + "R";
  box.innerHTML = `<a class="feat" href="players/${F.toban}.html" target="_blank" rel="noopener">
    <div class="feat-eyebrow">📖 今日の注目選手</div>
    <div class="feat-catch">「${F.catch}」</div>
    <div class="feat-basis">${F.basis}</div>
    <div class="feat-meta"><b>${F.name}</b><span class="feat-k">${F.k}</span> ・ ${F.age}歳 ・ ${F.br}支部 ・ 今日 ${F.venue} ${racesTxt} に出走</div>
  </a>`;
}
function renderVenues(){
  const box=document.getElementById("venues"); box.innerHTML="";
  DATA.venues.forEach((v,i)=>{
    const c=el(`<button class="chip" role="tab" aria-selected="${i===vi}">${v.name}</button>`);
    c.onclick=()=>{vi=i; rno=null; renderVenues(); renderRaces(); renderCard();};
    box.appendChild(c);
  });
}
function renderRaces(){
  const v=DATA.venues[vi], box=document.getElementById("races"); box.innerHTML="";
  if(rno==null) rno=v.races[0].no;
  v.races.forEach(r=>{
    const c=el(`<button class="chip" role="tab" aria-selected="${r.no===rno}">${r.no}R</button>`);
    c.onclick=()=>{rno=r.no; renderRaces(); renderCard();};
    box.appendChild(c);
  });
}
const WEMO = {"晴":"☀️","曇":"☁️","雨":"☔"};
function weatherBlock(venueName){
  const S=window.STATS;
  const wx = S.venues_wx && S.venues_wx[venueName];
  if(!wx) return "";
  const MIN=20;                       // これ以上の本数がある天候だけ「読み」に使う
  const order=["晴","曇","雨"];
  // 一番本数の多い天候をベースに、雨がどれだけ動くかを見る
  let cells="", solid=[];
  order.forEach(w=>{
    const d = wx[w] && wx[w]["1"];    // 1コースの1着率で比べる（初心者が一番よりどころにする数字）
    if(d){
      const thin = d.n<MIN ? " wthin" : "";
      cells += `<div class="wcell${thin}" data-w="${w}">
        <div class="wemo">${WEMO[w]} ${w}</div>
        <div class="wwin nums">${d.win}%</div>
        <div class="wn nums">${d.n}走</div></div>`;
      if(d.n>=MIN) solid.push({w, win:d.win, n:d.n});
    }else{
      cells += `<div class="wcell wthin"><div class="wemo">${WEMO[w]} ${w}</div>
        <div class="wwin">—</div><div class="wn">少</div></div>`;
    }
  });
  // 読み（お？を作る一文）：雨がベース天候からどれだけ動くかを主役にする
  let hint;
  const rain = solid.find(b=>b.w==="雨");
  const base = solid.find(b=>b.w==="晴") || solid.find(b=>b.w==="曇");
  if(rain && base){
    const d = Math.round((rain.win-base.win)*10)/10;
    if(d<=-8) hint=`<b>☔ 雨の${venueName}はインが崩れやすい。</b>1コース${rain.win}%（${WEMO[base.w]}${base.w}は${base.win}%）。荒れ（外の差し・まくり）が出やすい狙い目。`;
    else if(d>=8) hint=`<b>☔ 雨の${venueName}はむしろインが堅い。</b>1コース${rain.win}%（${WEMO[base.w]}${base.w}は${base.win}%）。人の逆を行ける場面。`;
    else hint=`☔ 雨でもインの強さはあまり変わらない（1コース${rain.win}% / ${WEMO[base.w]}${base.w}${base.win}%）。`;
  }else if(solid.length>=2){
    const hi=solid.reduce((a,b)=>b.win>a.win?b:a), lo=solid.reduce((a,b)=>b.win<a.win?b:a);
    if(hi.win-lo.win>=8) hint=`<b>${WEMO[lo.w]}${lo.w}はインが落ちやすく（1コース${lo.win}%）、${WEMO[hi.w]}${hi.w}は堅い（${hi.win}%）。</b>天候で狙い方を変えられる場。`;
    else hint=`天候によるインの強さの差は今のところ小さめ。`;
  }else{
    hint=`天候別はまだデータが少なめ。毎晩たまって、この会場の「雨のクセ」が見えてきます。`;
  }
  // 本数が十分な天候のうち、1着率が最も高いセルを強調（wtop）
  if(solid.length){
    const best=solid.reduce((a,b)=>b.win>a.win?b:a).w;
    cells=cells.replace(`<div class="wcell" data-w="${best}">`, `<div class="wcell wtop" data-w="${best}">`);
  }
  return `<div class="wsec">
    <div class="wsec-head">🌦️ 天候でこう変わる <span>1コースの1着率</span></div>
    <div class="wgrid">${cells}</div>
    <div class="whint">${hint}</div>
    <div class="wnote">直近${S.days}日の集計。本数が少ない天候（薄い表示）は参考程度に。日々たまって精度が上がります。</div>
  </div>`;
}
const KIMARITE_ORDER = ["逃げ","まくり","差し","まくり差し","抜き"];
function kimariteBlock(venueName){
  const S=window.STATS;
  const k = S.venues_kimarite && S.venues_kimarite[venueName];
  const nat = S.kimarite_overall;
  if(!k || !nat) return "";
  const MIN=20;                        // 天候ブロックと同じ基準
  const thin = k.n<MIN ? " kthin" : "";
  const top = KIMARITE_ORDER.reduce((a,b)=>k[b]>k[a]?b:a, KIMARITE_ORDER[0]);
  const rows = KIMARITE_ORDER.map(name=>{
    const cls = "krow" + thin + (name===top ? " ktop":"");
    return `<div class="${cls}">
      <span class="kname">${name}</span>
      <span class="kbar"><i style="width:${k[name]}%"></i></span>
      <span class="kval nums">${k[name]}%</span>
    </div>`;
  }).join("");
  // 読み：逃げ率の全国比較を主役に、荒れる場では"まくり系"の多さも添える
  let hint;
  if(k.n<MIN){
    hint = `決まり手はまだデータが少なめ（${k.n}レース）。毎晩たまって、この会場の「決まり方」が見えてきます。`;
  }else{
    const diff = Math.round((k["逃げ"]-nat["逃げ"])*10)/10;
    const makuri = Math.round((k["まくり"]+k["まくり差し"])*10)/10;
    if(diff>=8) hint=`<b>逃げが決まりやすい、堅い場。</b>逃げ決着${k["逃げ"]}%（全国平均${nat["逃げ"]}%）。イン逃げの信頼度が高い。`;
    else if(diff<=-8) hint=`<b>荒れやすい場。</b>逃げ決着は${k["逃げ"]}%にとどまり（全国平均${nat["逃げ"]}%）、まくり系（まくり＋まくり差し）が${makuri}%と多め。`;
    else hint=`決まり手の傾向はほぼ全国平均どおり（逃げ${k["逃げ"]}% / 全国${nat["逃げ"]}%）。`;
  }
  return `<div class="wsec">
    <div class="wsec-head">🎯 決まり手のクセ <span>直近${S.days}日 ${k.n}レース</span></div>
    ${rows}
    <div class="whint">${hint}</div>
    ${k.n<MIN ? `<div class="wnote">本数が少ないため参考程度に。</div>` : ""}
  </div>`;
}
function trendPanel(venueName){
  const S=window.STATS;
  if(!S || !S.venues || !S.venues[venueName]){
    return `<div class="trend"><div class="trend-head"><span class="trend-ttl"><span class="pin"></span>この会場のクセ</span></div>
      <div class="tna">傾向データは集計中です（毎晩たまっていきます）。</div></div>`;
  }
  const vs=S.venues[venueName], nat=S.overall;
  const MIN_N=20;   // 天候・決まり手ブロックと同じ基準：これ未満は薄く表示＋参考程度
  let rows="", thin1 = vs[1].n<MIN_N, anyThin=false;
  for(let c=1;c<=6;c++){
    const x=vs[c]; if(!x) continue;
    const thin = x.n<MIN_N; if(thin) anyThin=true;
    rows+=`<div class="trow${thin?" tthin":""}">
      <span class="tcourse"><span class="tdot" style="background:${LANES[c].bg}"></span>${c}コース</span>
      <span class="tbar"><i class="p3" style="width:${x.p3}%"></i><i class="win" style="width:${x.win}%"></i></span>
      <span class="tval-wrap">
        <span class="tval nums">${x.win}%</span>
        <span class="tval-sub nums">3着内${x.p3}%</span>
      </span>
    </div>`;
  }
  const v1=vs[1].win, n1=nat[1].win, v1p3=vs[1].p3, n1p3=nat[1].p3;
  let hint;
  if(v1>=n1+3) hint=`1コースの1着率が全国平均(${n1}%)より高め。インが信頼されやすい場。`;
  else if(v1<=n1-3) hint=`1コースの1着率が全国平均(${n1}%)より低め。波乱（外の差し・まくり）が起きやすい場。`;
  else hint=`1コースの強さはほぼ全国平均(${n1}%)どおり。`;
  hint += ` 1コースの3着以内率は${v1p3}%${thin1?"（本数少なめ・参考程度）":`（全国平均${n1p3}%）`}。`;
  return `<div class="trend">
    <div class="trend-head">
      <span class="trend-ttl"><span class="pin"></span>この会場のクセ</span>
      <span class="trend-sub">進入コース別 1着率・3着以内率 ・ 過去${S.days}日 ${vs[1].n}レース</span>
    </div>
    <div class="tlegend"><span><b class="win"></b>1着率</span><span><b class="p3"></b>3着以内率（1〜3着に入った割合）</span></div>
    ${rows}
    <div class="thint">${hint}</div>
    ${anyThin?'<div class="tna">本数が少ないコース(20走未満)は薄く表示・参考程度に。</div>':""}
    ${weatherBlock(venueName)}
    ${kimariteBlock(venueName)}
  </div>`;
}
function renderCard(){
  const v=DATA.venues[vi], r=v.races.find(x=>x.no===rno);
  const crewParam = encodeURIComponent(
    r.boats.filter(x=>PLAYER_PAGES.has(x.t)).map(x=>`${x.t}:${x.n}:${x.name}`).join(",")
  );
  const rows=r.boats.map(b=>{
    const L=LANES[b.n], mo=(b.mo==null?0:Math.round(b.mo*10)/10);
    return `<div class="boat">
      <div class="badge" style="background:${L.bg};color:${L.fg}">${b.n}</div>
      <div>
        <div class="bname">${playerName(b.name,b.t,crewParam)}<span class="bk">${b.k}</span></div>
        <div class="bmeta">${b.age}歳 · ${b.br} · ${b.wt}kg${stTag(b.t)}</div>
        ${konSetsuLine(b.ks)}
      </div>
      <div class="stats nums">
        <div class="stat"><div class="l">全国勝率</div><div class="v">${num(b.nw,2)}</div></div>
        <div class="stat"><div class="l">当地勝率</div><div class="v">${num(b.lw,2)}</div></div>
        <div class="stat mo"><div class="l">モーター2率</div><div class="v">${mo}%</div>
          <div class="bar"><i style="width:${mo}%"></i></div>
          ${motorPrevLine(v.name, b.mno)}</div>
      </div>
    </div>`;
  }).join("");
  document.getElementById("card").innerHTML=
    `<div class="card"><div class="card-head">
       <div class="ttl">${v.name} <span>${r.no}R</span></div>
       <div class="dl nums">締切 ${r.dl||"—"}</div>
     </div>${rows}</div>`
    + trendPanel(v.name);
}
renderFeatured(); renderVenues(); renderRaces(); renderCard();
