# 殿堂(titles.html)の称号の変化を週1回Xへ投稿し、選手ページを作り直す。
#
# 【見るもの】players/career/titles.json(results.yml が毎日2回作る)
#   ランキング型14本の首位交代・新しいトップ10入り / 会場称号48枠の交代
# 判定と文面は scripts/x_title_watch.py。過去の週での再現は x_title_replay.py。
#
# 【以前の版(AI-8)について】
# 当初は選手ページの一言(build_profiles_v5 の catch)を「二つ名」として監視して
# いたが、殿堂の称号とは別物だった。catch は週188人が動く値で、投稿しない。
# 2026-09-14 にその版の投稿がCronから出た(削除済み)。
#
# 【選手ページを毎週作り直す理由】
# 選手ページ冒頭の一言は直近1年のローリングで決まり、走らなくても窓が滑るだけで
# 変わる。生成を配線するまで2026-08-27から据え置きになっていた。
#
# 【なぜ月曜20:20 JSTか】
# 土日の開催ぶんが results.yml(深夜01:00)で反映され終わっている。
# 20:05 は昇級ウォッチ(x-post-daily.yml)が使っているので15分ずらす。
# concurrency も別グループにして、待たされないようにしてある。
#
# 【本番の起動は外部キッカー(Supabase Cron → kick-github)】
# GitHubのcronは混雑すると数時間遅れる。2026-09-07の初回は5時間遅れてJST01:35に
# 発火し、下の窓ガードが正しく弾いて投稿されなかった。x-post-daily.yml と同じく、
# 起動をSupabase Cronへ移す。scheduleは「キッカーが止まった週の保険」として残す。
#
# Cronの本文は inputs で dry_run を渡すこと。**省略すると既定の true が効いて
# dry-run になり、投稿されない**(下の入力の default が true のため)。
#   {"workflow": "weekly.yml", "inputs": {"dry_run": "false"}}
#
# 【止めたいとき】
# Actionsタブ →「二つ名ウォッチ(週次)」→ 右上「…」→ Disable workflow。
# キッカー側を止めるなら Supabase の Cron を無効にする。
name: 二つ名ウォッチ(週次)

on:
  schedule:
    # 月曜 20:20 JST（UTC 11:20）。GitHubのcronは混雑すると飛ぶが、
    # 飛んだ週は投稿が1本抜けるだけで、翌週が新しい as_of を見て追いつく。
    - cron: '20 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに本文を確認するだけにする（false にすると実際に投稿します）'
        type: boolean
        default: true
      # 鳴らせない警報は、鳴らないのと同じ(results.yml と同じ考え方)。true にすると、仕事
      # (状態の更新・選手ページの作り直し・コミット)を普通に済ませたあと、最後にわざと失敗させて
      # notify-failure が本当に Issue を立てるところまで通す。稽古のときは dry_run に関係なく
      # 投稿しない(下の投稿の段で dry-run に倒す)。立った Issue は稽古なので、確かめたら閉じる。
      notify_selftest:
        description: '失敗の通知を試す(仕事を済ませたあと、わざと失敗させてIssueが立つか見る。投稿はしません)'
        type: boolean
        default: false

# 状態ファイル(x_state/)・プロフィールの変遷(profile_history.json)・選手ページをコミットするため。
permissions:
  contents: write

# x-post 系とは別グループ。昇級ウォッチ(20:05)と待ち合わせないようにする。
concurrency:
  group: weekly-titles
  cancel-in-progress: false

env:
  # データ本体(results/)は data ブランチにある。下の _data がその作業ディレクトリ。
  TEIYOMI_DATA_ROOT: ${{ github.workspace }}/_data
  # 【投稿の元栓】false のあいだは、どの経路から起動しても本番投稿しない(dry-runになる)。
  # true のときだけ、定時実行と「dry_run=false の手動・キッカー起動」が本番投稿になる。
  #
  # 以前はこの値を schedule の経路でしか見ておらず、Supabase Cron → kick-github は
  # workflow_dispatch + dry_run=false で来るので素通りしていた。2026-09-14 に
  # catch版の投稿がCronから出たのはそのため(false にしていても止まらなかった)。
  # 2026-09-19 に "true" にした(殿堂の称号版の dry-run を CI で確認し、JAM が文面を承認したあと)。
  # 初回の本番投稿は 2026-09-21(月)20:20 JST の Supabase Cron(kick-weekly-titles)。止めるときは "false" に戻す。
  POST_LIVE: "true"

jobs:
  titles:
    runs-on: ubuntu-latest
    steps:
      # ref を明示するのは、状態ファイルを必ず最新で読むため
      # (指定しないと「実行が作られた瞬間のコミット」で固定される)。
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: データ本体(dataブランチ)を _data に取り出す
        uses: actions/checkout@v7
        with:
          ref: data
          path: _data

      # 置き場所の指定ミスで「データが空」のまま走ると、中身のない二つ名で
      # 1636枚を上書きしてしまう。数ファイルしか無い時点で止める。
      - name: データが揃っているか確認
        run: |
          n=$(ls _data/results/*.jsonl 2>/dev/null | wc -l)
          echo "results 年ファイル: ${n}件"
          test "$n" -ge 10

      # GitHubのcronは混雑すると数時間遅れて発火することがある。人が見ていない
      # 時間帯に投稿しないよう、19:00〜23:59 JST の外なら投稿も状態更新もせず
      # 緑で終わらせる。手動起動は時刻に関係なく通す。
      - name: 投稿してよい時間帯か確かめる
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          JST_TIME=$(TZ=Asia/Tokyo date +%H:%M)
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 10# は 08/09 を8進数と誤解釈させないため。
          if [ "$((10#$JST_HOUR))" -ge 19 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "window guard: skipped (JST ${JST_TIME}, event=schedule)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: 依存を入れる
        if: steps.gate.outputs.go == 'true'
        run: pip install requests requests-oauthlib

      # 殿堂の称号を前回と突き合わせ、首位交代・トップ10入りがあれば投稿する。
      # titles.json を読むだけなので、下の選手ページ生成とは独立している。
      - name: 殿堂の称号の変化を見て、あれば投稿する
        if: steps.gate.outputs.go == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          # このファイルの入力の読み方は github.event.inputs(schedule では中身が無く空になる)
          SELFTEST: ${{ github.event.inputs.notify_selftest }}
        run: |
          # まず元栓。false なら起動経路に関係なく dry-run にする。
          # ここを最初に見るのは、キッカー(workflow_dispatch)が schedule の分岐を
          # 通らないため。元栓を後ろに置くと、また素通りする。
          if [ "${POST_LIVE}" != "true" ]; then
            echo "POST_LIVE=${POST_LIVE} のため dry-run で確認します（event=${EVENT_NAME}・投稿はしません）"
            python scripts/x_title_watch.py --dry-run
          elif [ "${SELFTEST}" = "true" ]; then
            echo "通知の稽古のため dry-run で確認します（投稿はしません）"
            python scripts/x_title_watch.py --dry-run
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            echo "定時実行・本番投稿します"
            python scripts/x_title_watch.py
          elif [ "${DRY_RUN}" = "false" ]; then
            # 手動実行とキッカー。入力が空・想定外の値なら下の dry-run に倒す
            # (黙って本番投稿になるほうが怖いため)。
            echo "手動/キッカー起動・本番投稿します"
            python scripts/x_title_watch.py
          else
            echo "手動実行・dry-run で確認します（投稿はしません）"
            python scripts/x_title_watch.py --dry-run
          fi

      # 投稿したら、状態ファイルだけを先にコミットする(2026-10-21)。
      # 以前は選手ページを作り直したあとにまとめてコミットしていたため、選手ページの段が落ちると
      # 投稿は出たのに状態が残らず、翌週も同じ変化を「新しい」と見て同じ内容を投稿していた
      # (2026-09-21〜10-19 の5週。9/21と9/28、10/12と10/19が重複)。投稿と状態の保存を離さない。
      - name: 二つ名ウォッチの状態を先にコミット
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add x_state/
          if git diff --staged --quiet; then
            echo "状態に変化なし"
            exit 0
          fi
          git commit -m "x_state: 二つ名ウォッチの状態を記録 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          for i in 1 2 3; do
            git push && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 選手ページを作り直す。冒頭の一言が変わった選手は profile_history.json に残る。
      - name: 選手ページを作り直す(一言とプロフィールの変遷)
        if: steps.gate.outputs.go == 'true'
        run: python build_all_player_pages.py

      - name: 更新をコミット
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add x_state/ profile_history.json players/ players_index.js players_list.js sitemap.xml site_lastmod.json
          if git diff --staged --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "殿堂ウォッチ・選手ページを週次で更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          # 他のワークフローとpushが重なった時のために、rebaseして数回やり直す。
          for i in 1 2 3; do
            git push && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 通知の稽古(手動実行で notify_selftest=true のときだけ)。ここまでの仕事は普通に済ませてある。
      - name: 通知の稽古のため、わざと失敗させる
        if: github.event.inputs.notify_selftest == 'true'
        run: |
          echo "通知の配線を試すため、わざと失敗させます(投稿・選手ページ・コミットは済んでいます)"
          exit 1

  # ---- 失敗の通知(2026-10-21) ----
  # 本体(titles)が失敗したら GitHub Issue を立てる。2026-09-21〜10-19 の5週、選手ページの段が
  # 毎週落ちていたのに通知が無く、誰も気づかなかったため。立て方は results.yml・daily.yml と同じ
  # (scripts/notify_run_failure.py → gh_issue.py: 同じ題が開いていればコメントで足す・同じ run では1回だけ)。
  notify-failure:
    needs: [titles]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 失敗を Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "二つ名ウォッチ・選手ページ(weekly.yml)が失敗しました"
          --hint "投稿の段より後で落ちた場合、投稿は出ていて、二つ名ウォッチの状態は先にコミット済み(同じ投稿は繰り返さない)。
          選手ページ・五十音・プロフィールの変遷は前の週のまま。直したら weekly.yml を dry_run のまま手動で1回
          走らせれば作り直せる(投稿はしない)。"

