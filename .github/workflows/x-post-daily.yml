# 昇級ボーダーウォッチの変化を、毎晩20:05 JSTにXへ投稿する。
#
# 【なぜデータ生成(01:00)と時刻を分けているか】
# 結果データの集計は results.yml が深夜01:00に済ませている。投稿だけを人が
# 見ている時間帯に切り出すことで、集計が遅れても投稿時刻はぶれず、
# 投稿でこけても集計側は無傷、という関係にしてある。
# results.yml / daily.yml には一切手を触れていない。
#
# 【止めたいとき】
# Actionsタブ →「昇級ウォッチをXへ投稿」→ 右上「…」→ Disable workflow。
# これで cron は止まり、手動起動もできなくなる。再開は同じ場所から Enable。
name: 昇級ウォッチをXへ投稿

on:
  schedule:
    # 20:05 JST（UTC 11:05）。GitHubのcronは混雑すると飛ぶが、飛んだ日は
    # 投稿が1日抜けるだけで、翌日の実行が新しい data_to を見て追いつく。
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに本文を確認するだけにする（false にすると実際に投稿します）'
        type: boolean
        default: true
      # 失敗の通知の稽古(2026-10-21・既定 off)。true にすると投稿は必ず dry-run になり、状態はコミットせず、
      # 最後にわざと失敗させて notify-failure が本当に Issue を立てるところまで通す。立った Issue は閉じる。
      notify_selftest:
        description: '失敗の通知を試す(投稿せず・状態もコミットせず、最後にわざと失敗させてIssueが立つか見る)'
        type: boolean
        default: false

# 状態ファイル(x_state/)をコミットするため。
permissions:
  contents: write

# x-post-test.yml と同じグループ。テスト投稿と重なっても同時に走らせない。
concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # ref を明示しているのは、状態ファイルを必ず最新で読むため。
      # 指定しないと「実行が作られた瞬間のコミット」で固定される。上の
      # concurrency で直列化していても、2つの実行がほぼ同時に作られた場合
      # (GitHubのcronが遅れて発火した直後に外部キッカーが叩いた等)、
      # 後続は前の実行が書いた last_posted_date を含まない古い状態を読み、
      # 同じ内容をもう一度投稿してしまう。実測で前の実行は33秒でコミットまで
      # 終わるので、この窓は約30秒。1日1回でも1年動かせば踏む。
      - uses: actions/checkout@v7
        with:
          ref: main

      # GitHubのcronは混雑すると数時間遅れて発火することがあり、実際に深夜3時台の
      # 投稿が起きた。本番の起動は外部キッカー(workflow_dispatch)に移してあるので、
      # scheduleは「キッカーが止まった日の保険」として残しつつ、人が見ている
      # 19:00〜23:59 JST の外で発火したら投稿も状態更新もせず緑で終わらせる。
      # 手動起動(workflow_dispatch)は時刻に関係なく通す。
      - name: 投稿してよい時間帯か確かめる
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # cronのUTC換算に頼らず、実行時のJSTの「時」で判定する。
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          JST_TIME=$(TZ=Asia/Tokyo date +%H:%M)
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # date +%H は 00〜23 なので、19以上だけ見れば 23:59 までを拾える。
          # 10# は 08/09 を8進数と誤解釈させないため。
          if [ "$((10#$JST_HOUR))" -ge 19 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "window guard: skipped (JST ${JST_TIME}, event=schedule)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: 依存を入れる
        if: steps.gate.outputs.go == 'true'
        run: pip install requests requests-oauthlib

      - name: 変化を見て、あれば投稿する
        if: steps.gate.outputs.go == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          # このファイルの入力の読み方は github.event.inputs(schedule では中身が無く空になる)
          SELFTEST: ${{ github.event.inputs.notify_selftest }}
        run: |
          # cron からの実行は本番投稿。手動実行は入力に従い、
          # 入力が空・想定外の値なら dry-run に倒す
          # (黙って本番投稿になるほうが怖いため)。
          # 通知の稽古は、いちばん先に見て必ず dry-run にする。
          if [ "${SELFTEST}" = "true" ]; then
            echo "通知の稽古のため dry-run で確認します（投稿はしません）"
            python scripts/x_kyusoku_watch.py --dry-run
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            echo "定時実行のため本番投稿します"
            python scripts/x_kyusoku_watch.py
          elif [ "${DRY_RUN}" = "false" ]; then
            echo "手動実行・本番投稿します"
            python scripts/x_kyusoku_watch.py
          else
            echo "手動実行・dry-run で確認します（投稿はしません）"
            python scripts/x_kyusoku_watch.py --dry-run
          fi

      # 投稿に失敗した場合は前のステップが非0で落ち、ここには来ない。
      # 状態が古いままなので、翌日もう一度同じ変化が拾われて投稿される
      # (成功していないのに「投稿済み」を記録しないほうが安全)。
      # 通知の稽古ではコミットしない。x_kyusoku_watch.py は dry-run でも状態を保存するので、
      # コミットすると「投稿していない変化」を投稿済みとして記録してしまう。
      - name: 状態ファイルをコミット
        if: steps.gate.outputs.go == 'true' && github.event.inputs.notify_selftest != 'true'
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add x_state/
          if git diff --staged --quiet; then
            echo "状態に変化なし"
            exit 0
          fi
          git commit -m "x_state: 昇級ウォッチの状態を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          # 他のワークフローとpushが重なった時のために、rebaseして数回やり直す
          # (触るディレクトリが別なので、rebaseで中身が壊れることはない)。
          for i in 1 2 3; do
            git push && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 通知の稽古(手動実行で notify_selftest=true のときだけ)。投稿も状態のコミットもしていない。
      - name: 通知の稽古のため、わざと失敗させる
        if: github.event.inputs.notify_selftest == 'true'
        run: |
          echo "通知の配線を試すため、わざと失敗させます(投稿していません・状態もコミットしていません)"
          exit 1

  # ---- 失敗の通知(2026-10-21) ----
  # 本体が失敗したら GitHub Issue を立てる(weekly.yml・results.yml と同じ作り)。
  # 状態のコミットが弾かれ続けて落ちた場合もここに来る(投稿は出たのに状態が残っていない=次の実行で
  # 同じ投稿が出うるので、その前に気づけるようにする)。
  notify-failure:
    needs: [watch]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 失敗を Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "昇級ウォッチの投稿(x-post-daily.yml)が失敗しました"
          --hint "止まったところが「状態ファイルをコミット」なら、投稿は出ているのに状態が保存されていない。run を再実行しないこと(再実行すると、すぐに同じ投稿が出る)。次の定時の前に、Actions タブでこのワークフローを止めてから x_state/ を直す。投稿の段で止まっていれば、投稿は出ておらず状態も変わっていない(次の定時で出直す)。"
