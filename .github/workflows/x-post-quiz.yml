# 今日の一問を、毎朝08:05 JSTにXへ1件投稿する(AI-14 v1⑥)。
#
# 【なぜ08:05か】毎朝のデータ更新(daily.yml 07:37)のあと、朝の通知の便(07:45〜09:45)とは分ける。
# 出題ファイル(quiz/{今日}.json)は results.yml が1週間先まで作り置いてあるので、この時刻には必ずある。
# 文面と事故よけは scripts/x_quiz_post.py(日付・答えは入れない・同じ日に2回は出さない)。
#
# 【元栓】POST_LIVE が "true" でない限り、どの経路から起動しても本番投稿しない(dry-run になる)。
# 2026-09-19 に "true" にした(JAM が dry-run の文面を確かめたあと)。
# 本番の起動は外部キッカー(GitHubのcronは混雑すると数時間遅れる):
#   Supabase Cron「kick-x-post-quiz」08:05 JST → kick-github → {"workflow": "x-post-quiz.yml", "inputs": {"dry_run": "false"}}
#   (inputs を省くと既定の dry_run=true が効いて投稿されない)
# schedule は「キッカーが止まった日の保険」として残す(下の窓の外なら何もしない)。
# 両方が動いても、同じ日の2件目は x_state/quiz_state.json で止まる(concurrency で直列・状態は main の最新を読む)。
#
# 【止めたいとき】POST_LIVE を "false" に戻す。急ぐなら Actions タブ →「今日の一問をXへ投稿」→ Disable workflow。
name: 今日の一問をXへ投稿

on:
  schedule:
    - cron: '5 23 * * *'   # 08:05 JST（UTC 23:05・前日）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに本文を確認するだけにする（false にすると実際に投稿します・POST_LIVE が true のときだけ）'
        type: boolean
        default: true
      # 失敗の通知の稽古(2026-10-21・既定 off)。true にすると投稿は必ず dry-run になり、状態はコミットせず、
      # 最後にわざと失敗させて notify-failure が本当に Issue を立てるところまで通す。立った Issue は閉じる。
      notify_selftest:
        description: '失敗の通知を試す(投稿せず・状態もコミットせず、最後にわざと失敗させてIssueが立つか見る)'
        type: boolean
        default: false

# 状態ファイル(x_state/quiz_state.json)をコミットするため。
permissions:
  contents: write

# X への投稿は同じグループで直列にする(昇級ウォッチ・テスト投稿と同時に走らせない)。
concurrency:
  group: x-post
  cancel-in-progress: false

env:
  # 【投稿の元栓】"true" のときだけ本番投稿になりうる。それ以外は起動経路に関係なく dry-run。
  POST_LIVE: "true"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # 状態ファイルを必ず最新で読むため ref を明示する(x-post-daily.yml と同じ理由)。
      - uses: actions/checkout@v7
        with:
          ref: main

      # GitHubのcronは混雑すると数時間遅れて発火する。朝の投稿が昼や夜に出ないよう、
      # 07:00〜10:59 JST の外で schedule から来たら、投稿も状態更新もせず緑で終わる。
      # 手動・キッカー(workflow_dispatch)は時刻に関係なく通す。
      - name: 投稿してよい時間帯か確かめる
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          JST_TIME=$(TZ=Asia/Tokyo date +%H:%M)
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 10# は 08/09 を8進数と誤解釈させないため。
          if [ "$((10#$JST_HOUR))" -ge 7 ] && [ "$((10#$JST_HOUR))" -le 10 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "window guard: skipped (JST ${JST_TIME}, event=schedule)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: 依存を入れる
        if: steps.gate.outputs.go == 'true'
        run: pip install requests requests-oauthlib

      - name: 今日の一問を投稿する
        if: steps.gate.outputs.go == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          # このファイルの入力の読み方は github.event.inputs(schedule では中身が無く空になる)
          SELFTEST: ${{ github.event.inputs.notify_selftest }}
        run: |
          # まず元栓。キッカー(workflow_dispatch)が schedule の分岐を通らないので、先頭で見る
          # (weekly.yml で元栓を後ろに置いていて素通りした 2026-09-14 の件と同じ形を作らない)。
          if [ "${POST_LIVE}" != "true" ]; then
            echo "POST_LIVE=${POST_LIVE} のため dry-run で確認します（event=${EVENT_NAME}・投稿はしません）"
            python scripts/x_quiz_post.py --dry-run
          elif [ "${SELFTEST}" = "true" ]; then
            echo "通知の稽古のため dry-run で確認します（投稿はしません）"
            python scripts/x_quiz_post.py --dry-run
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            echo "定時実行・本番投稿します"
            python scripts/x_quiz_post.py
          elif [ "${DRY_RUN}" = "false" ]; then
            # 手動実行とキッカー。入力が空・想定外の値なら下の dry-run に倒す(黙って本番投稿になるほうが怖い)。
            echo "手動/キッカー起動・本番投稿します"
            python scripts/x_quiz_post.py
          else
            echo "手動実行・dry-run で確認します（投稿はしません）"
            python scripts/x_quiz_post.py --dry-run
          fi

      # 投稿に失敗した場合は前のステップが非0で落ち、ここには来ない(投稿済みを記録しない)。
      # 通知の稽古ではコミットしない(投稿していないので、記録するものが無い)。
      - name: 状態ファイルをコミット
        if: steps.gate.outputs.go == 'true' && github.event.inputs.notify_selftest != 'true'
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add x_state/
          if git diff --staged --quiet; then
            echo "状態に変化なし"
            exit 0
          fi
          git commit -m "x_state: 今日の一問の投稿を記録 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          for i in 1 2 3; do
            git push && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 通知の稽古(手動実行で notify_selftest=true のときだけ)。投稿も状態のコミットもしていない。
      - name: 通知の稽古のため、わざと失敗させる
        if: github.event.inputs.notify_selftest == 'true'
        run: |
          echo "通知の配線を試すため、わざと失敗させます(投稿していません・状態もコミットしていません)"
          exit 1

  # ---- 失敗の通知(2026-10-21) ----
  # 本体が失敗したら GitHub Issue を立てる(weekly.yml・results.yml と同じ作り)。
  # 状態のコミットが弾かれ続けて落ちた場合もここに来る(投稿は出たのに状態が残っていない=次の実行で
  # 同じ投稿が出うるので、その前に気づけるようにする)。
  notify-failure:
    needs: [post]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 失敗を Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "今日の一問の投稿(x-post-quiz.yml)が失敗しました"
          --hint "止まったところが「状態ファイルをコミット」なら、投稿は出ているのに状態が保存されていない。run を再実行しないこと(再実行すると、すぐに同じ投稿が出る)。次の定時の前に、Actions タブでこのワークフローを止めてから x_state/ を直す。投稿の段で止まっていれば、投稿は出ておらず状態も変わっていない(次の定時で出直す)。 出題ファイルが無い日(results.yml の作り置き)もここで止まる。"
