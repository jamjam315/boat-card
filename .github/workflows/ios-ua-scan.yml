# iOSアプリの中で見たときに、出してはいけない文字とリンクが無いかを push のたびに確かめる。
#
# 【なぜ要るか】
# アプリの中身は teiyomi.com をそのまま出している。出してはいけないものは HTML から
# 消えているのではなく、**JS が UA を見て出し分けている**（ios.js / twa.js /
# app-links.js / billing-ios.js）。だから HTML を grep しても分からず、実際に描かせて
# 確かめるしかない。Web 側を直したついでに出し分けを壊すと、次の審査で気づくことになる。
#
# 【何を見るか】(中身は tools/ios-ua-scan.mjs の冒頭)
#   ・他のストアの名前とリンク（3.1.1）/「準備中」「開発中」（2.1）
#   ・boatrace.jp と、殻の許可リストに無い外部リンク（5.2.2・押しても開けない）
#   ・出し分けが効いているか（ブラウザの UA では同じ語が出ること）
#
# 外への通信はすべて遮って動かすので、**CI が本番の Supabase に触れることはない**
# （匿名ユーザーを増やさない）。
name: iOS UA scan

on:
  push:
    branches: [main]
    # 生成物(race/ players/)は毎日変わるが、作りは build_race_pages.py と
    # 各テンプレートで決まる。毎日のデータ更新でこれを回さないよう、
    # 「見た目を決めるもの」だけを対象にする。取りこぼしは下の定期実行で拾う。
    paths:
      - '*.html'
      - '*.js'
      - 'premium/**'
      - 'players/index.html'
      - 'build_race_pages.py'
      - 'build_all_player_pages.py'
      - 'site_pages.json'
      - 'tools/ios-ua-scan.mjs'
      - '.github/workflows/ios-ua-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'premium/**'
      - 'players/index.html'
      - 'build_race_pages.py'
      - 'build_all_player_pages.py'
      - 'site_pages.json'
      - 'tools/ios-ua-scan.mjs'
      - '.github/workflows/ios-ua-scan.yml'
  # 毎日のデータ更新で作り直されたページも、1日1回は見る（JSTの朝8時すぎ）。
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      # 失敗の通知の稽古(2026-10-21・既定 off)。確認を済ませたあと、わざと失敗させて Issue が立つか見る。
      notify_selftest:
        description: '失敗の通知を試す(確認を済ませたあと、わざと失敗させてIssueが立つか見る)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: iOSのUAで禁止語をさがす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # playwright は package.json の devDependencies に入れてある。
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/ios-ua-scan.mjs

      # 通知の稽古(手動実行で notify_selftest=true のときだけ)。確認そのものは済ませてある。
      - name: 通知の稽古のため、わざと失敗させる
        if: github.event.inputs.notify_selftest == 'true'
        run: |
          echo "通知の配線を試すため、わざと失敗させます(確認は済んでいます)"
          exit 1

  # ---- 失敗の通知(2026-10-21) ----
  # 定時(毎朝)の確認で落ちたときだけ Issue を立てる。push・PR のときは、そのコミットに赤い印が付き、
  # 直した人が見ているので立てない。定時の確認は誰も見ていないので、立てないと次の iOS 審査まで気づけない。
  notify-failure:
    needs: [scan]
    if: failure() && (github.event_name == 'schedule' || github.event.inputs.notify_selftest == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 失敗を Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "iOS の UA での確認(ios-ua-scan.yml)が失敗しました"
          --hint "毎朝の確認で、iOS アプリの中で出してはいけない文字・リンクが見つかったか、確認の道具が動かなかった。
          run のログ(node tools/ios-ua-scan.mjs の出力)で、どのページの何かを見る。次の iOS の審査の前に直す。"
