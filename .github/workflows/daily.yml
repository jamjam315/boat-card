name: 毎朝データ更新

on:
  # GitHub Actionsのscheduleは、混雑すると実行そのものが飛ぶ(遅れるのではなく、
  # その回が無かったことになる)。2026-08-27朝、07:30の便が飛んで手動実行するまで
  # 約4時間データが古いままだった。同じ日のうちに自分で追いつけるよう3便に増やす。
  #
  # 毎時0分・30分は世界中の予約が集中していちばん飛びやすいので、わざと半端な分に置く。
  # 1便目を07:30より後ろにしているのは、取得元の公開を待つため。
  schedule:
    - cron: '37 22 * * *'   # 07:37 JST（本番）
    - cron: '23 0 * * *'    # 09:23 JST（1便目が飛んだ・取れなかった時の追いつき）
    - cron: '7 3 * * *'     # 12:07 JST（最後の砦。朝の通知の時間帯(07〜11時台)は過ぎている）
  workflow_dispatch:         # 「Run workflow」で手動でも実行できる
    inputs:
      force_push_notice:
        description: '朝の通知を、JSTの時間帯に関係なく送る（復旧作業で昼以降に回す時だけON）'
        type: boolean
        default: false
      skip_if_fresh:
        description: '本日ぶんが取得済みなら何もしない（OFFにすると取得済みでも作り直す）'
        type: boolean
        default: true

permissions:
  contents: write

# 2つの実行を同時に走らせない。外部キッカーとGitHubのcronが近い時刻に
# 起動すると並走し得るが、この処理は1回7分ほどかかるため、途中で
# 鮮度ガードは効かない(まだ当日データを取っていないので両方とも通過する)。
# 結果、公式サーバーへのダウンロードが2重になり、data.jsを両方が作って
# 片方の push が non-fast-forward で弾かれる。
#
# 後発を待たせれば、動き出したときには鮮度ガードが「本日ぶん取得済み」で
# 5秒で空振りする。時刻をずらして避けるのではなく、ここで構造的に潰す
# (cronの発火時刻が読めないことが、そもそもの問題なので)。
# 走り出したデータ更新を途中で止めたくないので cancel-in-progress は false。
concurrency:
  group: daily-update
  cancel-in-progress: false

# データ本体(results/ program/ raw/)は data ブランチにある。
# 下の _data がその作業ディレクトリで、Pythonスクリプトはここを見る。
env:
  TEIYOMI_DATA_ROOT: ${{ github.workspace }}/_data

jobs:
  # 3便に増やしたぶん、既に取れている日は何もせずに終わる。
  #
  # 判定をここ(別ジョブ)に置いているのは、空振りの便でdataブランチ(約1GB)の
  # 取り出しまで走らせないため。data.jsだけを取り出して数秒で終わる。
  #
  # 比較は日本語のままだと環境しだいで崩れるので、ISO(YYYY-MM-DD)に直してから行う。
  # 読めない・欠けている時は「取れていない」側に倒す(空振りするより、
  # 二重に走って同じ結果を書くほうが安全)。
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data.js
          sparse-checkout-cone-mode: false

      - name: 本日ぶんが取得済みかどうか
        id: fresh
        env:
          SKIP_IF_FRESH: ${{ inputs.skip_if_fresh }}
        run: |
          # 手動実行で明示的にOFFにした時だけ、取得済みでも作り直す。
          # scheduleからの実行では空になるので、この分岐には入らない。
          if [ "${SKIP_IF_FRESH}" = "false" ]; then
            echo "skip_if_fresh=false のため、取得済みでも作り直します"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          have=$(grep -o '"date":"[^"]*"' data.js | head -1 | cut -d'"' -f4)
          iso=$(printf '%s' "$have" | sed 's/年/-/; s/月/-/; s/日//' \
                | awk -F- '{printf "%04d-%02d-%02d", $1, $2, $3}')
          today=$(TZ=Asia/Tokyo date +%F)
          echo "data.js: ${have:-読めず} (${iso:-−}) / 今日(JST): ${today}"

          if [ "$iso" = "$today" ]; then
            echo "本日ぶん取得済みのためスキップ"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "本日ぶんはまだ取得できていないので、このまま実行します"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: データ本体(dataブランチ)を _data に取り出す
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      # 置き場所の指定ミスで「データが空」のまま集計が走ると、中身のない
      # data.js や motors.js を正常なものとして上書きコミットしてしまう。
      # 数ファイルしか無い時点で止めて、事故を水際で防ぐ。
      - name: データが揃っているか確認
        run: |
          n=$(ls _data/results/*.jsonl 2>/dev/null | wc -l)
          echo "results 年ファイル: ${n}件"
          test "$n" -ge 10

      - name: lzh解凍ツールを入れる
        run: sudo apt-get update && sudo apt-get install -y lhasa

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 結果の収集(results.yml)は毎晩01:00の1回きりで、失敗すると無音でその日が
      # 欠ける(2025-09-15の146レースが10か月気づかれなかった)。2回動くこちら側で
      # 取りこぼしを拾い直す。既にある日は重複スキップされるので、通常は
      # 「0レース追加」で終わり、追加の負荷はK票2日ぶんのダウンロードだけ。
      # ここで拾った分の集計(stats.js等)は、次の01:00の結果収集で作り直される。
      - name: 前日ぶんの結果を取りこぼしていないか拾い直す
        run: python collect_results.py --days 2

      - name: 今日の番組表を取得して data.js を作る
        run: python fetch_update.py

      # 直前のfetch_update.pyが取得・解凍したb{yymmdd}.lzh/B{yymmdd}.TXTをそのまま
      # 再利用するので、公式サーバーへのダウンロードは1日1回のまま増えない。
      # 保存先は _data(dataブランチ)側。
      - name: 今日の番組表を履歴として保存(raw/B と program/)
        run: python collect_program.py

      - name: 今日の注目選手を選んで featured.js を作る
        run: python build_featured.py

      - name: モーターの前回使用者を選んで motors.js を作る
        run: python build_motors.py

      - name: レース単位の固有ページを生成(7日ローリング・sitemap再生成込み)
        run: python build_race_pages.py

      - name: 変化があればコミット(main・公開サイト)
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add data.js featured.js motors.js sitemap.xml race.css
          git add -A race/
          git diff --staged --quiet || git commit -m "update data ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push

      # data.jsをpushした直後に置いているのは、ここからGitHub Pagesの反映が
      # 始まるため(いちばん早く通知できる)。結果データの警報(最後のステップ)
      # より前に置くことで、警報が鳴った日でも通知は送られる。
      #
      # 【なぜCI側から叩くのか】
      # 朝の通知はSupabase Cron(07:45/08:45/09:45 JST)からも叩いているが、
      # data.jsを作るGitHub Actionsは遅延・欠落するため、決め打ちの時刻では
      # 「まだ前日のdata.jsしか無い」ことが常態化していた。データを公開した
      # 側が公開反映を見届けてから叩くのが本筋。cron3便は保険として残す
      # (二重送信は送信側の push_send_log が防ぐ)。
      #
      # 【CDNの取り扱い】
      # GitHub PagesのCDNはクエリでのキャッシュ回避もno-cacheも効かない
      # (実測済み。_shared/morning-message.ts のコメント参照)。ランナーが
      # 新しいコピーを見ても、Edge Functionの接続先がまだ古い可能性が残るため、
      # stale_dataが返ったら間を置いて数回やり直す。それでも駄目な場合は
      # 警告を出すだけにして、cron便に任せる(通知の遅れでCIを赤くしない)。
      - name: データ公開の反映を待って、朝の通知を叩く
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force_push_notice }}
        run: |
          set -u
          FUNC_URL="https://vynbhssakpxiikmseoja.supabase.co/functions/v1/send-morning-push"
          DATA_URL="https://teiyomi.com/data.js"

          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET が未設定のため、朝の通知は叩きません（Supabase Cronの3便に任せます）"
            exit 0
          fi

          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          hour=$(TZ=Asia/Tokyo date +%H)
          # 手動実行や大幅な遅延で昼過ぎに走った回で「朝の通知」が飛ぶのを防ぐ。
          # 復旧作業で意図的に回す時は force_push_notice で上書きできる。
          if [ "${FORCE}" != "true" ] && { [ "$hour" -lt 7 ] || [ "$hour" -gt 11 ]; }; then
            echo "現在 ${hour}時(JST)のため、朝の通知は送りません（07〜11時台のみ）"
            exit 0
          fi

          echo "data.js が ${today} になるまで待ちます（15秒おき・最大10分）"
          published=no
          for i in $(seq 1 40); do
            curl -sS --max-time 20 -o /tmp/published_data.js "$DATA_URL" || true
            gen=$(grep -o -m1 '"generated_at":"[0-9-]\{10\}' /tmp/published_data.js 2>/dev/null | cut -c17-)
            if [ "$gen" = "$today" ]; then
              echo "公開を確認しました（${i}回目・generated_at=${gen}）"
              published=yes
              break
            fi
            echo "  まだ ${gen:-取得できず} … ${i}/40"
            sleep 15
          done
          if [ "$published" != "yes" ]; then
            echo "::warning::10分待ってもdata.jsが今日のものになりませんでした。Supabase Cronの3便に任せます"
            exit 0
          fi

          # 反映を確認できても、Edge Functionの接続先がまだ古いコピーを返すことがある。
          for i in 1 2 3 4 5; do
            body=$(curl -sS --max-time 60 -X POST "$FUNC_URL" \
                    -H "x-cron-secret: ${CRON_SECRET}" \
                    -H "x-trigger: ci" \
                    -H "Content-Type: application/json" -d '{}')
            echo "応答(${i}/5): ${body}"
            case "$body" in
              *stale_data*)
                echo "  送信側からはまだ古いデータに見えています。30秒待ってやり直します"
                sleep 30
                ;;
              *sentUsers*)
                echo "朝の通知を送りました"
                exit 0
                ;;
              *)
                echo "::warning::想定外の応答でした。Supabase Cronの3便に任せます"
                exit 0
                ;;
            esac
          done
          echo "::warning::送信側から見て新しいデータにならなかったため送れませんでした。Supabase Cronの3便に任せます"

      # dataブランチへは別コミットで積む。結果収集(results.yml)と同時に走って
      # pushが弾かれた場合に備え、rebaseして数回やり直す(触るディレクトリが
      # 別なので、rebaseで中身が壊れることはない)。
      - name: 番組表の履歴をコミット(dataブランチ)
        working-directory: _data
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add -A program/ raw/ results/
          if git diff --staged --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "program update ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin data || exit 1
          done
          exit 1

      # 最後に置いているのは、ここで落ちても data.js 等の更新を止めないため。
      # 「気づくための警報」であって、サイト更新を妨げる関門ではない。
      # 0件の日があればワークフローが赤くなる。判定を「1件以上あるか」だけに
      # している理由は check_recent_results.py の説明を参照(荒天で23レースまで
      # 減った日が実在するため、件数のしきい値では誤報になる)。
      - name: 直近の結果データが欠けていないか確認
        run: python check_recent_results.py
