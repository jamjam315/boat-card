name: 結果データ収集

on:
  schedule:
    - cron: '0 16 * * *'   # 01:00 JST（前日ぶんの結果を収集）
  workflow_dispatch:
    inputs:
      days:
        description: 'さかのぼる日数（初回の一括取り込みは 30 などに、毎晩は 1）'
        default: '1'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lzh解凍ツールを入れる
        run: sudo apt-get update && sudo apt-get install -y lhasa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 結果を集めて貯める
        run: python collect_results.py --days ${{ github.event.inputs.days || '1' }}
      - name: コース傾向を計算
        run: python build_stats.py
      - name: 変化があればコミット
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add results.jsonl stats.js
          git diff --staged --quiet || git commit -m "results update ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
