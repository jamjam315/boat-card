name: 結果データ収集

on:
  schedule:
    - cron: '0 16 * * *'   # 01:00 JST（前日ぶんの結果を収集）
  workflow_dispatch:
    inputs:
      days:
        description: 'さかのぼる日数（初回の一括取り込みは 30 などに、毎晩は 1）'
        default: '1'
      ai_health_date:
        description: 'AI講評の成否を見る日(YYYY-MM-DD)。空ならJSTの前日'
        default: ''
      # 鳴らせない警報は、鳴らないのと同じ。ここを true にすると、池と作り置きの
      # 「済んだ印」だけを伏せて、notify-quiz が本当に Issue を立てるところまで通す。
      # 仕事そのもの(貯める・作る・配る)は普通に済ませるので、何も失わない。
      # 立った Issue は稽古なので、確かめたら閉じる。
      notify_selftest:
        description: '通知の配線を試す(池と作り置きの印だけ伏せて、Issueが立つか見る。仕事は普通に済ませます)'
        type: boolean
        default: false

permissions:
  contents: write

# 2つの実行を同時に走らせない。外部キッカーとGitHubのcronが近い時刻に起動すると
# 並走し得る。この処理は結果の取り込みからバックテストの再集計まで長く、
# 途中で止める手段が無いので、後発は前が終わるまで待たせる。
# (待った結果、同じ日を二度取り込むことになるが、collect_results.py は
#  date:会場:レース番号 で重複を弾くので「0レース追加」で終わる。)
# 走り出した集計を途中で止めたくないので cancel-in-progress は false。
concurrency:
  group: results-collect
  cancel-in-progress: false

# データ本体(results/ program/ raw/)は data ブランチにある。
# 下の _data がその作業ディレクトリで、Pythonスクリプトはここを見る。
# 出力のうち backtest-data/ と stats.js 等は main 側(ブラウザが直接読むため)。
env:
  TEIYOMI_DATA_ROOT: ${{ github.workspace }}/_data

jobs:
  collect:
    runs-on: ubuntu-latest
    # 今日の一問の2段(池を貯める・出題を作り置く)が済んだか(済んだ晩だけ "1")。
    # 済まなかった晩は下の notify-quiz が Issue で知らせる。
    outputs:
      snap_ok: ${{ steps.snap.outputs.ok }}
      quiz_ok: ${{ steps.quiz.outputs.ok }}
    steps:
      - uses: actions/checkout@v7

      - name: データ本体(dataブランチ)を _data に取り出す
        uses: actions/checkout@v7
        with:
          ref: data
          path: _data

      # 置き場所の指定ミスで「データが空」のまま集計が走ると、中身のない
      # stats.js や backtest-data/ を正常なものとして上書きコミットしてしまう。
      # 数ファイルしか無い時点で止めて、事故を水際で防ぐ。
      - name: データが揃っているか確認
        run: |
          n=$(ls _data/results/*.jsonl 2>/dev/null | wc -l)
          echo "results 年ファイル: ${n}件"
          test "$n" -ge 10

      - name: lzh解凍ツールを入れる
        run: sudo apt-get update && sudo apt-get install -y lhasa
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 結果を集めて貯める
        # 手動実行の入力は式を run に直接埋めない(シェルの文として読まれる)。環境変数で渡し、
        # 数字だけを通す(2026-09-18 点検 低5)。毎晩の起動では入力が無いので 1。
        env:
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          case "$DAYS" in
            ''|*[!0-9]*) echo "days は数字だけを受け付けます"; exit 1 ;;
          esac
          python collect_results.py --days "$DAYS"
      - name: コース傾向を計算
        run: python build_stats.py
      - name: 選手のST癖を計算
        run: python build_player_st.py
      # 朝の通知(プレミアム)の「この枠が強い」を根拠つきで言うための材料。
      # 直近3年で集計するので、日が進むにつれて窓がずれる=毎晩作り直す。
      - name: 選手の枠別成績を計算(通知の見どころ用)
        run: python build_frame_stats.py
      # 級別の履歴に使う期別ファイル(fan)。年2回しか増えないので、既にある期は
      # ダウンロードもしない。新しい期が出た日だけ1件増える。
      - name: 級別の期別ファイルを取り込む(新しい期が出たときだけ)
        run: python collect_fan_history.py
      - name: 選手のキャリア推移を計算(年別成績+級別変遷)
        run: python build_player_career.py
      - name: 選手バックテスト用の索引を作る(選手別・5bの選手条件で読む)
        # その選手が出たレースだけを1ファイルにまとめる。5b本体の
        # backtest-data/ には手を触れないので、既存の取得量は変わらない。
        run: python build_player_bt.py
      - name: バックテスト集計(全国まとめ)を計算
        run: python build_backtest.py
      - name: バックテスト(自由条件指定用の中間データ)を計算
        # 2026-07-19に会場×年ファイルへの分割対応が完了し、自動実行を再稼働。
        # 出力(backtest-data/)は年ファイル単位で増分更新されるだけなので、
        # 過去分を毎日全部作り直しても出力内容は同じ(冪等)。
        # 読み込み元は _data/results/、出力先は main の backtest-data/。
        run: python build_backtest_custom.py

      # 読み採点(P1-3)は端末の中で採点する。買い目を端末から出さない方針なので、
      # 結果のほうを公開側に置く必要がある。results/ は data ブランチにあって
      # ブラウザから読めないため、採点に要るぶんだけを main に書き出す。
      # 直近3日ぶんを作り直すのは、遅れて届いた結果を拾い直せるようにするため。
      - name: 読み採点用の払戻JSONを作る(payouts/)
        run: python build_payouts.py --days 3

      # ---- 今日の一問(AI-14 v1③) ----
      # 過去の実レースで読む練習。本線(結果・バックテスト・払戻)ではないので、ここで失敗しても
      # 後のコミットは止めない(continue-on-error)。
      # 1) 前日のレースページと同じ番組表の数字(data.js)を、出題の池として data ブランチの snapshots/ に貯める。
      #    この時刻の data.js は前日の最後の版(今日の版なら貯めずに飛ばす)
      #    ここも落ちたら下の notify-quiz が知らせる。その日の data.js は翌日には別の日のものに
      #    なっているので、貯め損ねた日はもう入らない(黙って落ちると池が静かに痩せる)。
      - name: 今日の一問の池を貯める(前日の data.js → snapshots/)
        id: snap
        continue-on-error: true
        env:
          SELFTEST: ${{ inputs.notify_selftest }}
        run: |
          python scripts/archive_race_snapshots.py
          # 稽古は仕事を済ませてから。印だけ伏せる(貯め損ねを作らない)
          if [ "$SELFTEST" = "true" ]; then echo "通知の配線を試すため、済んだ印を伏せます"; exit 1; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      # 2) 今日から1週間先まで、まだ無い日の出題を quiz/{出題日}.json に作る(作った日は作り直さない)。
      #    作ったらコミットの前にテストを流す。崩れていたら QUIZ_OK=0 を立て、下のコミットで quiz/ を足さない
      #    (その晩の出題は配らない。次の晩に作り直される)
      #    配らなかったことは下の notify-quiz が Issue で知らせる。ここを黙らせると、在庫(7日)が
      #    尽きる日まで気づけない。2026-09-18〜24 は毎晩ここで止まっていて、朝のX投稿が在庫切れで
      #    落ちて初めて分かった。
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 今日の一問を1週間先まで作り置く(崩れていたら配らない)
        id: quiz
        continue-on-error: true
        env:
          SELFTEST: ${{ inputs.notify_selftest }}
        run: |
          echo "QUIZ_OK=0" >> "$GITHUB_ENV"
          python build_quiz.py
          node --test tests/quiz-data.test.mjs
          echo "QUIZ_OK=1" >> "$GITHUB_ENV"
          # 稽古は配ってから。印だけ伏せる(その日の出題は普通に配られる)
          if [ "$SELFTEST" = "true" ]; then echo "通知の配線を試すため、済んだ印を伏せます"; exit 1; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: 変化があればコミット(main・公開サイト)
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add -A backtest-data/ players/career/ players/bt/ payouts/
          if [ "$QUIZ_OK" = "1" ]; then git add -A quiz/; else echo "今日の一問の出題は配らない(QUIZ_OK=$QUIZ_OK)"; fi
          git add stats.js players.js backtest.js frames.js kyusoku.json
          git diff --staged --quiet || git commit -m "results update ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          # 走っている間に別の push(毎朝の更新・手元からの push)があると弾かれ、この晩の集計が
          # まるごと公開されない(2026-09-17 に実際に起きた)。触るディレクトリは他と重ならないので、
          # dataブランチと同じく rebase して数回やり直す。
          # 重なるのは、もう1本の結果収集が先に push した生成物だけ(待たされた後発の run は、起動した
          # 時点の古いコミットから作るので、同じファイルを作り直している)。players/career/ などは生成時刻を
          # 持っていて中身が毎回違い、rebase が衝突していた(2026-09-18 01:05 の便が実際に失敗)。
          # 生成物はこの run が作った新しいほうを採る(-X theirs: rebase では「いま載せ直している自分の
          # コミット」側)。dataブランチ側は追記型のデータなので、この指定はしない。
          for i in 1 2 3; do
            git push && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase -X theirs origin main || exit 1
          done
          exit 1

      # dataブランチへは別コミットで積む。毎朝の番組表収集(daily.yml)と同時に
      # 走ってpushが弾かれた場合に備え、rebaseして数回やり直す(触るディレクトリが
      # 別なので、rebaseで中身が壊れることはない)。
      - name: 結果データをコミット(dataブランチ)
        working-directory: _data
        run: |
          git config user.name "boat-bot"
          git config user.email "boat-bot@users.noreply.github.com"
          git add -A results/ raw/ fan/ snapshots/
          if git diff --staged --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "results data ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            echo "pushが弾かれたのでrebaseして再試行 ($i/3)"
            git pull --rebase origin data || exit 1
          done
          exit 1

  # ---- AI講評の監視(2026-09-18) ----
  # 前日(JST)の講評の成否を Edge Function ai-health で読み、AIを1回以上呼んだ日に
  # 「成功0件」か「失敗が半分超」なら GitHub Issue を立てる(件数を読めなかったときも立てる)。
  # 結果の収集とは別ジョブ: どちらが失敗しても、もう片方は止めない。Issue を立てるので
  # このジョブだけ issues: write を持つ。赤くなるのは Issue すら立てられなかったとき。
  ai-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: AI講評の前日の成否を見る(おかしければ Issue)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 入力は式に直接埋めず環境変数で渡す。形はスクリプトが YYYY-MM-DD で確かめる
          AI_HEALTH_DATE: ${{ github.event.inputs.ai_health_date }}
        run: python3 scripts/check_ai_health.py

  # ---- 失敗の通知(2026-09-18) ----
  # 本体(collect)が失敗したら GitHub Issue を立てる。2026-09-18 01:05 の便が失敗していたのに、
  # 誰も見ていなかったため。立て方は AI講評の監視と同じ(scripts/gh_issue.py: 同じ題が開いていれば
  # コメントで足す・同じ run では1回だけ)。
  notify-failure:
    needs: [collect]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 失敗を Issue で知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "結果データ収集(results.yml)が失敗しました"
          --hint "結果そのものは毎朝の daily.yml が前日ぶんを拾い直す(集計 stats.js などは次の 01:00 で作り直し)。
          push の衝突なら、先に走った run が公開済みのことが多い。"

  # ---- 今日の一問の2段が止まったときの通知(2026-09-24) ----
  # collect の中の「池を貯める」「作り置き」は continue-on-error で、失敗しても本線を止めない。
  # そのぶんジョブは緑のままなので、ここで Issue を立てないと誰にも届かない。
  # 実際 2026-09-18〜24 の6晩、毎晩「作り置き」で止まっていたのに run はすべて緑で、在庫(7日ぶん)が
  # 尽きた9/24の朝、X投稿が「出題ファイルが無い」で落ちて初めて分かった。
  # collect ごと失敗した晩は上の notify-failure が知らせるので、ここは緑だったときだけ動く。
  # 2段は別の題で立てる(直す場所が違う)。両方止まった晩は2枚立つ。
  notify-quiz:
    needs: [collect]
    if: >-
      always() && needs.collect.result == 'success'
      && (needs.collect.outputs.snap_ok != '1' || needs.collect.outputs.quiz_ok != '1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: 池を貯められなかったことを Issue で知らせる
        if: needs.collect.outputs.snap_ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "今日の一問の出題の池が貯まりませんでした(results.yml)"
          --what "collect(今日の一問の池を貯める)"
          --hint "scripts/archive_race_snapshots.py が落ちた晩は、その日の data.js が池(dataブランチの snapshots/)に入らない。
          data.js は翌日には別の日のものに変わるので、その日ぶんは後から拾い直せない。
          すぐ出題が止まるわけではないが、放っておくと引ける池が痩せていく。
          run のログの [done] data.js(…) の行を見る。"
      - name: 出題を配れなかったことを Issue で知らせる
        if: needs.collect.outputs.quiz_ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/notify_run_failure.py
          --title "今日の一問の出題が配られませんでした(results.yml)"
          --what "collect(今日の一問を1週間先まで作り置く)"
          --hint "作り置き(build_quiz.py → tests/quiz-data.test.mjs)が落ちた晩は、その晩ぶんを1日も配らない。
          run のログの [quiz] の行(その日どのレースを引いたか)と、その下の error: の行を見る。
          在庫は7日ぶんなので、続くと朝08:05のX投稿と quiz.html が止まる。
          直したあと results.yml を手動で1回走らせれば、その日から配り直せる。"
