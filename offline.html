<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>オフラインです｜艇読み</title>
<!-- 通信できない時にだけ Service Worker が出す案内。
     データは一切キャッシュしていないので、ここには出走表や成績は出さない
     (古い数字を見せないという方針のまま、無言の失敗だけを防ぐ)。 -->
<meta name="robots" content="noindex">
<style>
/* このページだけはトークンを自前で持つ(theme.cssを読まない)。
   圏外で表示される画面なので、外部CSSに依存すると無スタイルで出てしまう。
   theme.cssの値を変えたときは、ここも合わせて直すこと。 */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#13242a; --ink2:#4a5a61; --muted:#7c8a90;
  --line:#e2e5e0; --line2:#d3d8d2; --accent:#0e7c66; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10171a; --surface:#182226; --ink:#eef3f2; --ink2:#aebcc0; --muted:#7e8d92;
    --line:#243136; --line2:#2e3d43; --accent:#3bbf9e; }
}
body{font-variant-numeric:tabular-nums lining-nums;}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.8;
  display:flex; align-items:center; justify-content:center; padding:24px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  max-width:420px; width:100%; padding:26px 22px; text-align:center;}
.lanes{display:grid; grid-template-columns:repeat(6,1fr); gap:3px; width:96px; height:9px; margin:0 auto 18px;}
.lanes i{display:block; border-radius:2px;}
h1{font-size:17px; margin:0 0 10px;}
p{font-size:13px; color:var(--ink2); margin:0;}
p.sub{font-size:11.5px; color:var(--muted); margin-top:12px;}
button{display:block; width:100%; margin-top:20px; padding:12px; border-radius:9px;
  border:none; background:var(--accent); color:#fff; font:inherit; font-size:13.5px;
  font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
  <div class="card">
    <div class="lanes" aria-hidden="true">
      <i style="background:#fff;border:1px solid var(--line2)"></i><i style="background:#2b2b2b"></i>
      <i style="background:#d83a36"></i><i style="background:#2f6fd0"></i>
      <i style="background:#f2c200"></i><i style="background:#1f9e54"></i>
    </div>
    <h1>オフラインです</h1>
    <p>接続を確認して、再読み込みしてください。</p>
    <p class="sub">艇読みは毎日データが入れ替わるため、古い出走表を残さないようにしています。そのため、通信できない間は内容を表示できません。</p>
    <button type="button" id="retry">再読み込み</button>
  </div>
<script>
// この案内が出ていても、アドレス欄は開こうとしたページのまま。
// そのため再読み込みするだけで本来のページへ戻れる。
document.getElementById("retry").addEventListener("click", function(){
  location.reload();
});
</script>
</body>
</html>
