<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 【CSP】このページが何を読み込んでよいかをブラウザに宣言する。
     万一XSSやCDNの乗っ取りが起きても、攻撃者が用意した別の場所へは
     つなげない・実行できないようにするための安全網。
     GitHub Pages はHTTPヘッダーを設定できないので meta で書いている。
     ※ frame-ancestors は meta では効かない仕様のため書いていない。 -->
<!-- AI講評(P2-5)から、ログイン確認とEdge Functionの呼び出しでSupabaseに出る。
     supabase-js は favorites.js が jsdelivr から読み込む。mypage.html と同じ許可。
     ここを広げたのはAI講評のためだけで、それ以外の行き先は増やしていない。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://vynbhssakpxiikmseoja.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>読み採点の答案｜艇読み</title>
<meta name="description" content="締切前に記録した買い目の答案です。読み点と結果点の内訳を、根拠になった数字と実測リフトつきで表示します。">
<!-- 記録は端末の中にしか無く、URLだけでは中身が決まらない(他の人が開いても
     何も出ない)。検索結果に出しても意味がないので、索引には載せない。 -->
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0f2a33">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
/* 【この画面だけの考え方】
   答案は「アプリの画面」ではなく「アプリの中に挟まった1枚の紙」。
   だから艇読み本体の色に合わせにいかない。周囲(ヘッダー・戻りリンク・
   フッター)はアプリの通常トーンのままで、その下に紙が置かれる構図にする。

   紙とアプリの橋渡しは3つだけ:
     ・紙のヘッダー帯は黒ではなく艇読みの既存ダークヘッダー色(--water)
     ・フォントは既存スタックのまま(紙らしさは色と罫線で出す)
     ・角丸は0〜2px(既存カードの丸みは使わない)

   紙の中の色は .paper にスコープした変数で閉じる。theme.css には触らない。
   ダークモードでも紙は紙のまま(周囲だけ暗くなる)。 */
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.7;}
.wrap{max-width:680px; margin:0 auto; padding:0 14px 40px;}
.nums{font-variant-numeric:tabular-nums lining-nums;}

.topbar{background:var(--water); color:var(--on-water); border-radius:0 0 var(--radius) var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:11px;}
/* ヘッダーの6色バーだけに効かせる。買い目の .lanes(艇番)にも当たってしまい、
   width:16px で「1-2-3」が縦に折れていた。 */
.topbar .lanes{display:grid; grid-template-rows:repeat(6,1fr); gap:2px; width:16px; height:34px;}
.topbar .lanes i{display:block; border-radius:2px;}
.topbar h1{font-size:18px; font-weight:600; margin:0; letter-spacing:.04em;}
.topbar p{font-size:11.5px; margin:1px 0 0; color:var(--on-water-sub);}
.back{display:block; margin:10px 2px 12px; font-size:12px; color:var(--muted); text-decoration:none;}
.back:hover{color:var(--accent);}
.foot{font-size:11px; color:var(--muted); margin:22px 2px 0; line-height:1.8;}
.foot a{color:var(--muted);}

/* ============================ ここから紙 ============================ */
.paper{
  --paper:#F5F2E8;          /* 紙地 */
  --paper-line:#D8D2C4;     /* 罫線 */
  --ink:#1E1E1C;            /* 本文(この中だけ上書き) */
  --ink-muted:#8A857A;      /* 補足 */
  --akapen:#C8202E;         /* 赤ペン */
  background:var(--paper); color:var(--ink);
  border-radius:2px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.paper .nums{font-variant-numeric:tabular-nums lining-nums;}

/* 1. 紙のヘッダー帯 */
.p-head{background:var(--water); color:var(--on-water);
  padding:11px 14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.p-head b{font-size:13px; font-weight:700; letter-spacing:.04em;}
.p-head .sub{font-size:10.5px; color:var(--on-water-sub); letter-spacing:.04em;}
.p-head .when{margin-left:auto; font-size:11.5px; color:var(--on-water-sub);}

/* 2. 総合点 */
.p-total{display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  padding:14px; border-bottom:1px solid var(--paper-line);}
.p-bars{flex:1 1 190px; min-width:0;}
.p-bar{margin-top:9px;}
.p-bar:first-child{margin-top:0;}
.p-bar .lb{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted);}
.p-bar .lb b{color:var(--ink); font-weight:700; font-size:12px;}
.p-bar .track{height:6px; margin-top:3px; background:#E7E2D4;}
.p-bar .fill{height:6px; background:var(--akapen);}
.p-meta{margin:10px 0 0; font-size:10.5px; color:var(--ink-muted);}
.p-tag{display:inline-block; padding:1px 7px; margin-right:6px;
  border:1px solid var(--paper-line); color:var(--ink-muted); font-size:10.5px;}
/* 方眼の上に赤い大数字 */
.p-big{flex:0 0 auto; padding:10px 14px; text-align:center;
  background:
    repeating-linear-gradient(0deg, transparent 0 11px, rgba(30,30,28,.07) 11px 12px),
    repeating-linear-gradient(90deg, transparent 0 11px, rgba(30,30,28,.07) 11px 12px);}
.p-big .n{display:block; font-size:64px; line-height:1; font-weight:800; color:var(--akapen);
  border-bottom:3px solid var(--akapen); padding-bottom:4px;}
.p-big .of{display:block; margin-top:5px; font-size:10.5px; color:var(--ink-muted);}
.p-big .wait{display:block; font-size:26px; line-height:1.2; font-weight:700; color:var(--ink-muted);
  border-bottom:3px solid var(--paper-line); padding-bottom:4px;}

/* 3. 軸・押さえ */
.p-axis{padding:12px 14px; border-bottom:1px solid var(--paper-line);}
.p-axis .line{font-size:13px;}
.p-axis .hon{color:var(--akapen); font-weight:800;}
.p-note{margin:6px 0 0; font-size:10.5px; color:var(--ink-muted); line-height:1.7;}

/* 見出し */
.p-sec{padding:10px 14px 0; font-size:10.5px; color:var(--ink-muted); letter-spacing:.06em;}

/* 4. 読みの内訳 */
.p-rows{list-style:none; margin:6px 0 0; padding:0;}
.p-rows li{display:flex; gap:10px; align-items:flex-start;
  padding:9px 14px; border-top:1px solid var(--paper-line);}
.p-rows li:first-child{border-top:none;}
.p-pt{flex:0 0 38px; height:38px; border-radius:50%; background:var(--akapen); color:#fff;
  font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;}
.p-pt.zero{background:transparent; color:var(--ink-muted); border:1px solid var(--paper-line);
  border-radius:2px; font-weight:400;}
.p-rowbody{flex:1; min-width:0;}
.p-rowname{font-size:10.5px; color:var(--ink-muted);}
.p-rowfact{font-size:13px; font-weight:700; margin-top:1px;}
.p-rowwhy{font-size:10.5px; color:var(--ink-muted); margin-top:2px;}

/* 5. 買い目の表 */
.p-tbl{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
.p-tbl th, .p-tbl td{padding:7px 6px; border-top:1px solid var(--paper-line); text-align:left;}
.p-tbl th{font-size:10px; color:var(--ink-muted); font-weight:400; border-top:none;}
.p-tbl th:first-child, .p-tbl td:first-child{padding-left:14px;}
.p-tbl th:last-child, .p-tbl td:last-child{padding-right:14px; text-align:right;}
.p-tbl .amt{text-align:right; color:var(--ink-muted);}
.p-bet{font-weight:700; white-space:nowrap;}
.p-bet.lose{text-decoration:line-through; color:var(--ink-muted); font-weight:400;}
.p-badge{display:inline-block; padding:1px 7px; font-size:10.5px; font-weight:700;
  background:var(--akapen); color:#fff; white-space:nowrap;}
.p-badge.off{background:#E7E2D4; color:var(--ink-muted); font-weight:400;}
.p-pay{color:var(--akapen); font-weight:700;}
/* 投入・払戻・収支・回収率 */
.p-sum{display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px 14px;}
.p-cell{flex:1 1 74px; border:1px solid var(--paper-line); padding:6px 8px; text-align:center;}
.p-cell span{display:block; font-size:9.5px; color:var(--ink-muted);}
.p-cell b{display:block; font-size:13px; margin-top:1px;}
.p-cell.roi{border-color:var(--akapen);}
.p-cell.roi b{color:var(--akapen);}

/* 6. 当日のようす */
.p-day{padding:10px 14px; border-top:1px solid var(--paper-line); font-size:12.5px;}
.p-day .k{color:var(--ink-muted); font-size:10.5px;}

/* 7. 講評(赤枠+ノート風の薄赤横罫)
   【罫と行を必ず一致させる】
   行送りと罫の間隔を --kohyo-line ひとつから作る。以前は行に margin-top:6px を
   足し、免責だけ line-height を変えていたため、行が進むほど罫からズレていった。
   ズレの起点になりやすいものは罫の外へ出す:
     ・総評(赤太字・文字が大きい)  → 上の無地帯
     ・免責(小さい灰文字)          → 下の無地帯
   罫が乗るのは本文だけにして、そこは行送りを変えない。
   罫の原点を1行目の行boxの上端に合わせるため、本文の padding は左右だけにする
   (背景の原点は padding box の上端なので、padding-top を入れるとその分ズレる)。 */
.p-rev{--kohyo-line:28px;
  margin:12px 14px 14px; border:1px solid var(--akapen); position:relative;}
.p-rev .by{position:absolute; top:-8px; right:8px; background:var(--paper);
  padding:0 5px; font-size:9.5px; color:var(--akapen);}
.p-rev-head{margin:0; padding:12px 12px 0; font-size:12.5px; line-height:1.7;
  color:var(--akapen); font-weight:700;}
.p-rev-body{list-style:none; margin:12px 0 0; padding:0 12px;
  background:repeating-linear-gradient(180deg,
    transparent 0 calc(var(--kohyo-line) - 1px),
    rgba(200,32,46,.13) calc(var(--kohyo-line) - 1px) var(--kohyo-line));}
.p-rev-body li{font-size:12.5px; line-height:var(--kohyo-line); margin:0;}
.p-rev-note{margin:0; padding:10px 12px 12px; font-size:10.5px; line-height:1.8;
  color:var(--ink-muted);}
.p-rev .none{margin:0; padding:12px; font-size:12.5px; color:var(--ink-muted);}

/* 7b. AI講評。赤ペン(講評)とは別物だと一目で分かるようにする。
   枠線を赤ではなく紙の罫の色にして、ラベルを「AI講評」にする。
   紙の様式は崩さない(角丸なし・同じ余白・同じ文字サイズ)。 */
.p-ai{margin:0 14px 14px; border:1px solid var(--paper-line); position:relative;
  background:rgba(30,30,28,.02);}
.p-ai .by{position:absolute; top:-8px; right:8px; background:var(--paper);
  padding:0 5px; font-size:9.5px; color:var(--ink-muted);}
.p-ai-body{margin:0; padding:12px; font-size:12.5px; line-height:1.9; white-space:pre-wrap;}
.p-ai-meta{margin:0; padding:0 12px 10px; font-size:9.5px; color:var(--ink-muted);}
.p-ai-act{margin:0; padding:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.p-ai-btn{font:inherit; font-size:12.5px; padding:7px 14px; cursor:pointer;
  background:var(--paper); color:var(--ink); border:1px solid var(--ink-muted); border-radius:2px;}
.p-ai-btn:disabled{opacity:.5; cursor:default;}
.p-ai-left{font-size:10.5px; color:var(--ink-muted);}
.p-ai-msg{margin:0; padding:0 12px 12px; font-size:11.5px; color:var(--ink-muted); line-height:1.7;}

/* 同意画面。紙の上に出すが、読み飛ばされないよう本文の文字サイズで書く。 */
.ai-consent{padding:12px;}
.ai-consent p{margin:8px 0 0; font-size:12px; line-height:1.8;}
.ai-consent .ai-ttl{margin:0; font-size:13px; font-weight:700;}
.ai-consent .ai-list{border-left:2px solid var(--paper-line); padding-left:9px;}
.ai-consent .ai-act{display:flex; gap:8px; flex-wrap:wrap;}
.ai-consent button{font:inherit; font-size:12.5px; padding:7px 14px; cursor:pointer;
  border-radius:2px; border:1px solid var(--ink-muted); background:var(--paper); color:var(--ink);}
.ai-consent .ai-ok{background:var(--akapen); border-color:var(--akapen); color:#fff; font-weight:700;}

/* 8. 紙のフッター */
.p-foot{padding:9px 14px 11px; border-top:1px solid var(--paper-line);
  font-size:9.5px; color:var(--ink-muted); line-height:1.7;
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}

.p-empty{padding:14px; font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="lanes" aria-hidden="true">
      <i style="background:#fff"></i><i style="background:#2b2b2b"></i><i style="background:#d83a36"></i>
      <i style="background:#2f6fd0"></i><i style="background:#f2c200"></i><i style="background:#1f9e54"></i>
    </div>
    <div><h1>読み採点</h1><p>答案</p></div>
  </header>
  <a class="back" href="mypage.html">← マイページに戻る</a>
  <div id="paper"></div>
  <p class="foot"><b>予想印（◎○▲）は出していません。</b>この採点は、記録した時点の番組表の数字と、確定した結果だけで機械的に付けています。<br>舟券の購入は20歳になってから。のめり込みに注意し、余裕資金の範囲で楽しみましょう。<br><a href="/about.html">運営者情報</a></p>
</div>

<!-- 二つ名は講評でだけ使う。読めなくても他の行は出るので、空にして進む。 -->
<script src="/players_list.js" onerror="window.PLAYER_LIST=[]"></script>
<!-- ?v= は yomi.js / yomi-race.js のキャッシュ避け。GitHub Pages は
     max-age=600 を返すので、HTMLだけ新しくJSが古い、という食い違いが
     10分間起こりうる(実機で講評が出なかったのがこれ)。HTMLとJSの版を
     URLで結びつけて、必ず対になったものが読まれるようにする。
     ★yomi.js / yomi-race.js / yomi-ai.js を変えたら、この数字を3か所すべて
       上げること (yomi.html / mypage.html / build_race_pages.py)
     ★一度使った番号は、たとえ公開前に取り消しても二度と使わない。
       v=6 は作業中に一度当てて戻したため、その中身をキャッシュした
       ブラウザが存在する。同じ番号で別の中身を配ると、そのブラウザには
       いつまでも古いJSが読まれ続ける(実際に手元で起きた)。 -->
<!-- favorites.js は TeiyomiAuth(Supabaseクライアントとログイン状態)を作る。
     AI講評の権利確認に要る。読めなくてもAI講評の枠が出ないだけで、
     採点と赤ペンの講評は端末の中だけで動き続ける。 -->
<script src="/favorites.js"></script>
<script src="/yomi.js?v=7"></script>
<script src="/yomi-ai.js?v=7"></script>
<script>
(function(){
  "use strict";
  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  var box = document.getElementById("paper");
  var q = new URLSearchParams(location.search);
  var key = q.get("key") || "";
  var tag = q.get("tag") || "";

  function empty(msg){
    box.innerHTML = '<div class="card"><p class="empty">' + esc(msg) + '</p>' +
      '<p class="note">記録はこの端末の中にしかありません。別の端末や、記録を消したあとでは開けません。</p></div>';
  }

  if(!window.TeiyomiYomi){ empty("読み込みに失敗しました。"); return; }

  // 二つ名(講評でだけ使う)。読めなくても講評の他の行は出るので、
  // onerror で空にして先へ進む。
  var catches = {};
  (window.PLAYER_LIST || []).forEach(function (x) {
    if (x && x.t && x.catch) catches[x.t] = x.catch;
  });

  var p = TeiyomiYomi.paper(key, tag, catches);
  if(!p){ empty("この端末に記録がありません。"); return; }

  var part = p.key.split(":");
  var res = p.result;
  var yomi = p.yomi;
  var yen = function(n){ return (n >= 0 ? "+" : "−") + Math.abs(n).toLocaleString(); };
  var MAXY = TeiyomiYomi.MAX_YOMI_PT, MAXR = TeiyomiYomi.MAX_RESULT_PT;

  // ---- 1. 紙のヘッダー帯 ----
  var html = '<article class="paper">' +
    '<div class="p-head"><b>読み採点</b><span class="sub">答案 — ' +
      (p.settled ? '添削済' : '未添削') + '</span>' +
      '<span class="when nums">' + esc(part[0]) + '　' + esc(part[1]) + ' ' + esc(part[2]) + 'R' +
      (p.tag ? '　/　' + esc(p.tag) : '') + '</span></div>';

  function bar(label, pt, max){
    return '<div class="p-bar"><div class="lb"><span>' + label +
      '</span><b class="nums">' + (pt == null ? "—" : pt) + ' / ' + max + '</b></div>' +
      '<div class="track"><div class="fill" style="width:' +
      (pt == null ? 0 : Math.round(pt / max * 100)) + '%"></div></div></div>';
  }

  // ---- 2. 総合点 ----
  // 結果が出るまでは点を出さない。レース前に点を出すと、それは買い目への
  // 評価＝予想になってしまう。採点は「済んだことを振り返る」ためのもの。
  if(!p.settled){
    html += '<div class="p-total"><div class="p-bars">' +
      '<p class="p-meta" style="margin:0">' +
        (p.tag ? '<span class="p-tag">' + esc(p.tag) + '</span>' : '') +
        '記録 ' + p.records.length + '点 ／ 投入 ' +
        p.records.reduce(function(s,r){ return s + r.amount; }, 0).toLocaleString() + '円</p>' +
      '<p class="p-note">レースの結果が確定してから採点します（翌朝までに埋まります）。' +
      '結果が出る前に点や講評を出すと、買い目への評価＝予想になってしまうため、' +
      'ここでは何も出していません。</p></div>' +
      '<div class="p-big"><span class="wait">採点待ち</span>' +
      '<span class="of">結果確定後に採点</span></div></div>';
    html += '<p class="p-sec">記録した買い目（' + p.records.length + '点）</p>' +
      '<table class="p-tbl"><tr><th>券種</th><th>買い目</th><th>金額</th></tr>' +
      p.records.map(function(r){
        return '<tr><td>' + esc(r.ken) + '</td>' +
          '<td class="p-bet nums">' + esc(TeiyomiYomi.betText(r.ken, r.lanes)) + '</td>' +
          '<td class="amt nums">' + r.amount + '円</td></tr>';
      }).join("") + '</table>';
    html += paperFoot();
    box.innerHTML = html + '</article>';
    return;
  }

  var yp = yomi ? yomi.pt : null;
  var rp = (res && res.pt != null) ? res.pt : null;
  var total = (yp || 0) + (rp || 0);
  html += '<div class="p-total"><div class="p-bars">' +
    bar("読み", yp, MAXY) + bar("結果", rp, MAXR) +
    '<p class="p-meta">' + (p.tag ? '<span class="p-tag">' + esc(p.tag) + '</span>' : '') +
      '自動採点（' + esc(TeiyomiYomi.YOMI_VERSION) + '）</p></div>' +
    '<div class="p-big"><span class="n nums">' + total + '</span>' +
    '<span class="of">100点満点</span></div></div>';

  if(res.status === "void"){
    html += '<p class="p-note" style="padding:0 14px">不成立（返還）のため、結果点は付きません。</p>';
  }

  // ---- 3. 軸・押さえ ----
  if(yomi){
    html += '<div class="p-axis"><p class="line" style="margin:0">軸 <span class="hon">' +
      yomi.axis + '号艇</span>（推定）' +
      (yomi.backs.length ? '　押さえ ' + yomi.backs.map(function(n){ return n + "号艇"; }).join("・") : '') +
      '</p><p class="p-note">軸と押さえは買い目から推定しています（' +
      (yomi.byFirst ? "1着に置いた回数がいちばん多い艇を軸" : "買い目に出てくる回数がいちばん多い艇を軸") +
      '、同数なら艇番の小さいほう）。読み点は軸の艇について付けています。</p>' +
      '<p class="p-note">読み点は「どの枠を選んだか」ではなく' +
      '「軸にした艇に実測の材料があったか」を測ります。' +
      'コースの有利不利は計測の時点で差し引いてあります。</p></div>';
  }

  // ---- 4. 読みの内訳 ----
  html += '<p class="p-sec">読みの内訳</p>';
  if(!yomi){
    html += '<p class="p-empty">記録した時点の出走表が残っていないため、読み点は付けられません。</p>';
  } else {
    html += '<ul class="p-rows">' + yomi.rows.map(function(r){
      // 根拠はコンパクトに1行。「7.0以上 +12.6pt・39日・35,404走」
      var why = r.note ? esc(r.note)
        : esc(r.band) + ' ' + esc(r.lift) + '・' + esc(r.period);
      return '<li><span class="p-pt nums' + (r.pt ? '' : ' zero') + '">' +
        (r.pt > 0 ? "+" : "") + r.pt + '</span><span class="p-rowbody">' +
        '<span class="p-rowname">' + esc(r.cat) + '　' + esc(r.label) +
          ' <span class="nums">' + r.pt + '/' + r.max + '</span></span>' +
        '<div class="p-rowfact">' + esc(r.fact) + '</div>' +
        '<div class="p-rowwhy">' + why + '</div>' +
        '</span></li>';
    }).join("") + '</ul>';
  }

  // ---- 5. 記録した買い目 ----
  html += '<p class="p-sec">記録した買い目（' + p.records.length + '点）</p>' +
    '<table class="p-tbl"><tr><th>券種</th><th>買い目・判定</th><th>金額</th><th>払戻</th></tr>' +
    p.records.map(function(r){
      var s = r.score;
      var hit = s && s.st === "hit";
      var badge = !s ? '<span class="p-badge off">採点待ち</span>'
        : hit ? '<span class="p-badge">的中</span>'
        : s.st === "void" ? '<span class="p-badge off">不成立</span>'
        : s.st === "nodata" ? '<span class="p-badge off">結果なし</span>'
        : '<span class="p-badge off">不的中</span>';
      return '<tr><td>' + esc(r.ken) + '</td>' +
        '<td><span class="p-bet nums' + (s && !hit && s.st === "miss" ? ' lose' : '') + '">' +
          esc(TeiyomiYomi.betText(r.ken, r.lanes)) + '</span> ' + badge + '</td>' +
        '<td class="amt nums">' + r.amount + '円</td>' +
        '<td class="nums' + (hit ? ' p-pay' : ' amt') + '">' +
          (hit ? s.yen.toLocaleString() + '円' : '—') + '</td></tr>';
    }).join("") + '</table>';
  if(res.status === "hit" || res.status === "miss"){
    html += '<div class="p-sum">' +
      '<div class="p-cell"><span>投入</span><b class="nums">' + res.bet.toLocaleString() + '</b></div>' +
      '<div class="p-cell"><span>払戻</span><b class="nums">' + res.yen.toLocaleString() + '</b></div>' +
      '<div class="p-cell"><span>収支</span><b class="nums">' + yen(res.profit) + '</b></div>' +
      '<div class="p-cell roi"><span>回収率</span><b class="nums">' + res.roi + '%</b></div></div>';
  }

  // ---- 6. 当日のようす ----
  var s0 = p.records[0].score;
  html += '<div class="p-day">';
  if(s0 && s0.wave != null){
    html += '<span class="k">当日のようす</span>　<span class="nums">波高 ' + s0.wave + 'cm' +
      (s0.top3 ? '　／　着順 ' + s0.top3.join("-") : '') + '</span>' +
      (s0.kimarite ? '　／　' + esc(s0.kimarite) : '') +
      '<p class="p-note">記録した時に見えていた直前情報とのズレは、次の段階（講評）で扱います。</p>';
  } else {
    html += '<span class="k">当日のようす</span>　結果がまだ出ていません。';
  }
  html += '</div>';

  // ---- 7. 講評 ----
  // 文面はエンジン(yomi.js)の出力をそのまま流す。ここでは並べるだけで、
  // 文言を足したり言い換えたりしない。
  var rev = (p.comment || []).filter(function(l){ return l.kind !== "note"; });
  var note = (p.comment || []).filter(function(l){ return l.kind === "note"; });
  html += '<div class="p-rev"><span class="by">採点: 艇読み</span>';
  if(!rev.length && !note.length){
    html += '<p class="none">特記事項なし</p>';
  } else {
    // 総評(1行目)と免責は罫の外に出す。文字の大きさが違うので、罫の上に
    // 乗せるとその行から先がずれていくため。
    if(rev.length) html += '<p class="p-rev-head">' + esc(rev[0].text) + '</p>';
    var body = rev.slice(1);
    if(body.length){
      html += '<ul class="p-rev-body">' +
        body.map(function(l){ return '<li>' + esc(l.text) + '</li>'; }).join("") + '</ul>';
    }
    html += note.map(function(l){
      return '<p class="p-rev-note">' + esc(l.text) + '</p>'; }).join("");
  }
  html += '</div>';

  // ---- 7b. AI講評 ----
  // 枠だけ先に置いて、中身は描画後に differ で入れる(同意・通信が絡むので、
  // 文字列を組み立てるこの流れの中では扱わない)。
  html += '<div class="p-ai" id="aiBox"><span class="by">AI講評</span></div>';

  html += paperFoot();
  box.innerHTML = html + '</article>';
  renderAi(p);

  // ---- AI講評の描画 ----
  // 段は3つだけ。「生成済み(端末にある)」「これから生成できる」「使えない」。
  // 生成済みなら二度と送らない。再表示は端末から読むだけで、回数も減らない。
  function renderAi(p){
    var box = document.getElementById("aiBox");
    var AI = window.TeiyomiYomiAi;
    if(!box) return;
    if(!AI || !p.settled){ box.parentNode.removeChild(box); return; }

    if(p.ai){ showAi(box, p.ai.text, p.ai.model, p.ai.at); return; }

    var label = '<span class="p-ai-left">この答案の内容を' + esc(AI.PROVIDER_NAME) +
      'に送って、赤ペンとは別の講評を1本書いてもらいます。</span>';
    box.innerHTML = '<span class="by">AI講評</span><p class="p-ai-act">' +
      '<button type="button" class="p-ai-btn" id="aiGo">🤖 AI講評を読む</button>' + label + '</p>';

    document.getElementById("aiGo").addEventListener("click", function(){
      if(!AI.hasConsent()){ askConsent(box, p); return; }
      run(box, p);
    });
  }

  function askConsent(box, p){
    box.innerHTML = '<span class="by">AI講評</span>' + window.TeiyomiYomiAi.consentHtml();
    box.querySelector(".ai-ok").addEventListener("click", function(){
      window.TeiyomiYomiAi.setConsent();
      run(box, p);
    });
    box.querySelector(".ai-no").addEventListener("click", function(){ renderAi(p); });
  }

  function run(box, p){
    box.innerHTML = '<span class="by">AI講評</span>' +
      '<p class="p-ai-act"><button type="button" class="p-ai-btn" disabled>生成中…</button>' +
      '<span class="p-ai-left">15秒ほどかかります。</span></p>';
    window.TeiyomiYomiAi.generate(p).then(function(res){
      if(!res.ok){
        box.innerHTML = '<span class="by">AI講評</span>' +
          '<p class="p-ai-msg">' + esc(res.message) + '</p>' +
          '<p class="p-ai-act"><button type="button" class="p-ai-btn" id="aiRetry">戻る</button></p>';
        var b = document.getElementById("aiRetry");
        if(b) b.addEventListener("click", function(){ renderAi(p); });
        return;
      }
      // 端末に残す。保存できなくても、いま出ているものは消さない
      // (次に開いたときに残っていないだけで、この画面では読める)。
      TeiyomiYomi.setAi(p.key, p.tag, { text: res.text, model: res.model });
      showAi(box, res.text, res.model, new Date().toISOString(), res.remaining);
    });
  }

  function showAi(box, text, model, at, remaining){
    var d = at ? new Date(at) : null;
    var z = function(n){ return (n < 10 ? "0" : "") + n; };
    var when = d && !isNaN(d.getTime())
      ? d.getFullYear() + "/" + z(d.getMonth()+1) + "/" + z(d.getDate()) + " " +
        z(d.getHours()) + ":" + z(d.getMinutes())
      : "";
    box.innerHTML = '<span class="by">AI講評</span>' +
      '<p class="p-ai-body">' + esc(text) + '</p>' +
      '<p class="p-ai-meta">' + esc(model) + (when ? '　' + esc(when) + ' 生成' : '') +
      '　この答案の講評はこの端末に保存されています（読み直しても回数は減りません）。' +
      (typeof remaining === "number" ? '　残り ' + remaining + ' 回' : '') + '</p>';
  }

  // ---- 8. 紙のフッター ----
  function paperFoot(){
    var d = new Date();
    var z = function(n){ return (n < 10 ? "0" : "") + n; };
    return '<div class="p-foot"><span>予想印は出していません。記録した時点の番組表の数字と、' +
      '確定した結果だけで機械的に付けています。</span>' +
      '<span class="nums">艇読み — 読み採点 ' + esc(TeiyomiYomi.YOMI_VERSION) + '　' +
      d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate()) + ' ' +
      z(d.getHours()) + ':' + z(d.getMinutes()) + '</span></div>';
  }
})();
</script>
</body>
</html>
